# Ship the router's log to promtail on the media host, so it survives the
# router's reboots.
#
# Install to /opt/etc/syslog-ng.d/remote on the router, then:
#   /opt/etc/init.d/S01syslog-ng restart
#
# Why this file exists rather than the built-in setting: the router's
# stock remote logging (nvram log_ipaddr) emits BSD-format syslog
# (RFC3164), and promtail's syslog receiver parses only RFC5424.
# syslog-ng's syslog() driver emits RFC5424, so shipping goes through
# scribe instead.
#
# Kept in this repo because /opt and /jffs are not covered by any backup
# here, and a firmware update can discard them.

# The router logs every dropped inbound packet (nvram fw_log_x=drop), and
# that is almost all of its log volume: roughly one line every 5 to 20
# seconds of internet background scanning, none of which reaches a
# service. Dropping it here keeps the useful events -- boot, WAN, DDNS,
# dropbear logins -- legible in Loki.
#
# Turning fw_log_x off on the router is the better fix, because it also
# stops the noise flushing the router's own in-tmpfs log within hours.
# This filter is the belt to that braces, and is still worth having if
# drop-logging is ever switched back on.
filter f_not_scan_noise {
    not message("BLOCKED - INBOUND");
};

destination d_promtail {
    syslog(
        "192.168.50.10"
        transport("tcp")
        port(1514)
    );
};

log {
    source(src);
    filter(f_not_scan_noise);
    destination(d_promtail);
    # No flags(final): the local log still receives everything, so the
    # router stays diagnosable on its own when the host is the thing
    # that is down.
};

#eof
