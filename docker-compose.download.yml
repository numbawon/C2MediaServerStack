# Standalone (non-swarm) compose -- deployed with:
#   docker compose -f docker-compose.download.yml up -d
#
# Lives outside the Swarm stack because `network_mode: service:vpn-client`
# (forcing qBittorrent's traffic through the VPN container) is a plain-
# compose-only feature; Swarm has no equivalent. See docker-stack.yml header.
#
# Only qBittorrent lives here. It is the one app whose exposure actually
# needs the tunnel: it announces itself to trackers and connects to peers.
# Everything that merely *searches* -- Prowlarr, Sonarr, Radarr,
# LazyLibrarian -- is a swarm service in docker-stack.yml and reaches
# indexers through gluetun's HTTP proxy on ${COMMON_LAN_IP}:8888 instead,
# so a VPN reconnect no longer takes the whole *arr stack down with it.
#
# Traefik labels are NOT used here -- Traefik's docker provider is running in
# swarmMode and only watches swarm services, so it would never see this
# container. Routing instead comes from a static entry in
# traefik/dynamic.yml pointing at vpn-client's `qbittorrent` network alias
# (see below): qBittorrent has no network of its own, it shares
# vpn-client's, but the alias means nothing else needs to know that.

# Explicit project name so this and docker-compose.plex.yml don't both fall
# back to the directory name and flag each other's containers as "orphans"
# on every deploy (harmless today, but --remove-orphans would nuke the
# other stack).
# Log rotation, same reasoning as docker-stack.yml: the json-file driver
# defaults to unlimited size with no rotation, and a container writing to
# stdout filled the root disk once already.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

name: mediastack-download

services:
  # gluetun, not bubuntux/nordvpn. The old image was archived upstream and
  # its own boot log told you to migrate to bubuntux/nordlynx -- which has
  # since been archived too (Nov 2025), so following that advice would have
  # meant swapping one dead project for another. gluetun is actively
  # maintained, speaks NordVPN's WireGuard (NordLynx) directly, and brings
  # the LAN HTTP proxy below with it instead of needing a second container.
  #
  # The transport did not actually change: the old container was already
  # running NordLynx (TECHNOLOGY=NordLynx), so this swaps the wrapper around
  # the same WireGuard tunnel, reusing the very same private key.
  vpn-client:
    logging: *logging
    # qBittorrent shares this container's network namespace, so recreating
    # it takes qBittorrent down with it. Diun will tell you when a new
    # gluetun image ships; do the bump by hand when you can watch it come
    # back.
    image: qmcgaw/gluetun:latest
    container_name: vpn-client
    cap_add:
      - NET_ADMIN
    devices:
      # gluetun needs the tun device even on WireGuard.
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=wireguard
      - SERVER_COUNTRIES=${COMMON_VPN_COUNTRY}
      - TZ=${COMMON_TZ}

      # gluetun's firewall drops everything not explicitly allowed. These
      # three subnets are the ones that must bypass the tunnel:
      #   10.0.1.0/24    the `edge` overlay -- how Traefik reaches the four
      #                  web UIs sharing this namespace. Without it their
      #                  replies get routed into the tunnel and every app
      #                  behind this container goes dark.
      #   172.20.0.0/16  docker_gwbridge, this container's actual path off
      #                  the host (the old image needed a hand-written
      #                  iptables script in ./vpn-init for exactly this;
      #                  gluetun makes it a setting, so that script is gone).
      #   the LAN        so LAN clients can use the HTTP proxy below.
      - FIREWALL_OUTBOUND_SUBNETS=10.0.1.0/24,172.20.0.0/16,${COMMON_LAN_SUBNET}
      # Inbound on the default interface: the HTTP proxy, plus qBittorrent's
      # web UI. 8989/7878/5299 were here for Sonarr/Radarr/LazyLibrarian
      # back when they shared this namespace; they are swarm services now
      # and listen on their own addresses.
      - FIREWALL_INPUT_PORTS=8888,8080

      # Built-in HTTP proxy (CONNECT-capable, so it handles HTTPS too).
      # Anything on the LAN pointed at COMMON_LAN_IP:8888 exits through the
      # VPN. Credentials are mandatory here, not optional politeness: an
      # unauthenticated proxy is an open relay for anything that can reach
      # the port.
      # gluetun defaults to DNS-over-TLS, but NordVPN's network blocks
      # outbound 853, so every lookup timed out and the healthcheck put the
      # tunnel in a restart loop -- while plain HTTP to 1.1.1.1 worked fine,
      # which is what pinned the fault on DNS rather than the tunnel. These
      # are NordVPN's own resolvers, which are only reachable from inside
      # the tunnel, so "plain" here still means the query never leaves the
      # VPN. (gluetun warns about this setting in general; that warning is
      # about pointing it at a public resolver reachable outside the tunnel,
      # which these are not.)
      - DNS_UPSTREAM_RESOLVER_TYPE=plain
      - DNS_UPSTREAM_PLAIN_ADDRESSES=103.86.96.100:53,103.86.99.100:53

      - HTTPPROXY=on
      - HTTPPROXY_LISTENING_ADDRESS=:8888
      - HTTPPROXY_USER_SECRETFILE=/run/secrets/httpproxy_user
      - HTTPPROXY_PASSWORD_SECRETFILE=/run/secrets/httpproxy_password
    ports:
      # Bound to the LAN address specifically, NOT 0.0.0.0 -- the proxy has
      # no business listening on every interface on the box.
      - "${COMMON_LAN_IP}:8888:8888"
    secrets:
      - wireguard_private_key
      - httpproxy_user
      - httpproxy_password
    # qbittorrent shares this container's network namespace
    # (network_mode: service:vpn-client below), so it has no network
    # identity of its own. This alias gives it one anyway: everything
    # else on `edge` reaches it as http://qbittorrent:8080 rather than
    # a generic http://vpn-client:8080. Same IP under the hood, but the
    # reference reads like what it means.
    #
    # sonarr/radarr/lazylibrarian used to be aliased here too, back when
    # they shared this namespace. They are swarm services now and carry
    # their own names, so claiming those aliases here would collide.
    networks:
      edge:
        aliases:
          - qbittorrent
    restart: unless-stopped

  qbittorrent:
    logging: *logging
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:vpn-client"
    depends_on:
      - vpn-client
    environment:
      - PUID=${COMMON_PUID}
      - PGID=${COMMON_PGID}
      - TZ=${COMMON_TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${COMMON_CONFIG}/qbittorrent:/config
      - ${COMMON_DOWNLOADS}:/downloads
      - ${COMMON_COMPLETED}:/completed
    restart: unless-stopped

networks:
  edge:
    external: true   # the attachable overlay network created by the swarm stack

secrets:
  # Names here are gluetun's expected /run/secrets/<name> filenames. The
  # WireGuard key was lifted straight out of the old container's running
  # tunnel (`wg show nordlynx private-key`) -- same account, same key, so
  # no NordVPN manual-setup round trip was needed to migrate.
  wireguard_private_key:
    file: ./secrets/nordlynx_private_key.txt
  httpproxy_user:
    file: ./secrets/httpproxy_user.txt
  httpproxy_password:
    file: ./secrets/httpproxy_password.txt
