# Standalone (non-swarm) compose — deployed with:
#   docker compose -f docker-compose.download.yml up -d
#
# Lives outside the Swarm stack because `network_mode: service:vpn-client`
# (forcing qBittorrent's traffic through the VPN container) is a plain-
# compose-only feature; Swarm has no equivalent. See docker-stack.yml header.
#
# Traefik labels are NOT used here — Traefik's docker provider is running in
# swarmMode and only watches swarm services, so it would never see these
# containers. Routing to qbittorrent instead comes from a static entry in
# traefik/dynamic.yml pointing at vpn-client:8080 (qBittorrent has no network
# of its own; it shares vpn-client's).

# Explicit project name so this and docker-compose.plex.yml don't both fall
# back to the directory name and flag each other's containers as "orphans"
# on every deploy (harmless today, but --remove-orphans would nuke the
# other stack).
name: mediastack-download

services:
  vpn-client:
    image: bubuntux/nordvpn:latest
    container_name: vpn-client
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TOKENFILE=/run/secrets/nordvpn_token
      - CONNECT=United_States
      - TECHNOLOGY=NordLynx
      - NETWORK=192.168.50.0/24
    secrets:
      - nordvpn_token
    volumes:
      - ./vpn-init:/custom-cont-init.d:ro
    networks:
      - edge
    restart: unless-stopped

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:vpn-client"
    depends_on:
      - vpn-client
    environment:
      - PUID=${COMMON_PUID}
      - PGID=${COMMON_PGID}
      - TZ=${COMMON_TZ}
      - WEBUI_PORT=8080
    volumes:
      - qbittorrent_config:/config
      - ${COMMON_DOWNLOADS}:/downloads
      - ${COMMON_COMPLETED}:/completed
    restart: unless-stopped

  # Moved out of the Swarm stack so their indexer-search traffic (not just
  # qBittorrent's actual downloads) exits through the VPN too. Same
  # network_mode:service:vpn-client sharing as qbittorrent above -- these
  # have no independent network identity of their own now, reachable
  # internally only as vpn-client:<port>, same as qbittorrent already is.
  # Traefik's static route in traefik/dynamic.yml reflects that; any other
  # app that talks to these directly (Seerr, Bazarr, Prowlarr) needs to use
  # vpn-client:<port>, not sonarr:8989/radarr:7878/lazylibrarian:5299.
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:vpn-client"
    depends_on:
      - vpn-client
    environment:
      - PUID=${COMMON_PUID}
      - PGID=${COMMON_PGID}
      - TZ=${COMMON_TZ}
    volumes:
      - sonarr_config:/config
      - ${COMMON_MEDIA}/TV:/tv
      - ${COMMON_DOWNLOADS}:/downloads
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    network_mode: "service:vpn-client"
    depends_on:
      - vpn-client
    environment:
      - PUID=${COMMON_PUID}
      - PGID=${COMMON_PGID}
      - TZ=${COMMON_TZ}
    volumes:
      - radarr_config:/config
      - ${COMMON_MEDIA}/Movies:/movies
      - ${COMMON_DOWNLOADS}:/downloads
    restart: unless-stopped

  lazylibrarian:
    image: linuxserver/lazylibrarian:latest
    container_name: lazylibrarian
    network_mode: "service:vpn-client"
    depends_on:
      - vpn-client
    environment:
      - PUID=${COMMON_PUID}
      - PGID=${COMMON_PGID}
      - TZ=${COMMON_TZ}
    volumes:
      - lazylibrarian_config:/config
      - ${COMMON_MEDIA}/EBooks:/books
      - ${COMMON_DOWNLOADS}:/downloads
    restart: unless-stopped

networks:
  edge:
    external: true   # the attachable overlay network created by the swarm stack

volumes:
  # Explicit name so it isn't prefixed by the compose project name (which
  # defaults to the directory name) — keeps scripts/backup-local.sh and
  # backup-offsite.sh's volume list stable regardless of what directory
  # this repo happens to live in.
  qbittorrent_config:
    name: qbittorrent_config
  sonarr_config:
    name: sonarr_config
  radarr_config:
    name: radarr_config
  lazylibrarian_config:
    name: lazylibrarian_config

secrets:
  nordvpn_token:
    file: ./secrets/nordvpn_token.txt
