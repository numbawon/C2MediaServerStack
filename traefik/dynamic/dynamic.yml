# Traefik file-provider dynamic config. Loaded via --providers.file.directory
# in docker-stack.yml. Supports Go templating (env function) same as Traefik's
# other dynamic config files.
#
# Two things live here instead of as Docker labels:
#   1. The `authentik` forwardAuth middleware every other service's Swarm
#      labels reference as `authentik@file`.
#   2. Static routers/services for qbittorrent and plex -- both run as
#      standalone (non-swarm) containers, which Traefik's swarmMode docker
#      provider can't auto-discover via labels. They're reachable by name
#      because they're joined to the same `edge` overlay network.

http:
  middlewares:
    # cloudflared doesn't set X-Forwarded-Proto when forwarding an HTTPS
    # client request to this HTTP backend (known cloudflared gap), so
    # every app behind Traefik would otherwise see the request as plain
    # HTTP even though the real client used HTTPS -- breaks CSRF/cookie
    # secure-scheme checks (bit Authentik's provider-save CSRF check).
    # Attached at the entrypoint level in docker-stack.yml so it applies
    # to every router without needing to touch each one individually.
    force-forwarded-proto:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"

    # Rate limit. Deliberately generous: this exists to stop a flood, not
    # to police normal use. Plex streaming, Immich thumbnail grids and
    # Audiobookshelf all burst hard from a single client, and a limit
    # tight enough to catch a slow scanner would break them -- the scanner
    # that hit this host managed 102 requests over several minutes, which
    # no sane rate limit would catch anyway. CrowdSec handles that shape;
    # this handles the fast one.
    #
    # sourceCriterion is left at the default remote address, which Traefik
    # has already resolved to the real client IP via the entrypoint's
    # forwardedheaders.trustedips -- otherwise every request would be
    # attributed to cloudflared and the whole household would share one
    # bucket.
    ratelimit:
      rateLimit:
        average: 100
        burst: 200
        period: 1s
        # WITHOUT sourceCriterion THIS IS WORSE THAN NOTHING. Every request
        # reaches Traefik from cloudflared's single IP, so the default
        # (bucket per TCP source) puts the entire household -- and any
        # attacker -- in ONE shared bucket. Verified: two different client
        # IPs behind the tunnel drained the same allowance, so one noisy
        # client would 429 everyone else, and a flood would deny service
        # rather than absorb it.
        #
        # Cf-Connecting-Ip is set by Cloudflare on every request and holds
        # the true client address, so it gives each client its own bucket.
        sourceCriterion:
          requestHeaderName: Cf-Connecting-Ip

    # Security headers.
    #
    # NOT frameDeny: that sends X-Frame-Options DENY, which breaks any
    # legitimate embedding. SAMEORIGIN allows a service to frame its own
    # pages while still blocking third-party clickjacking.
    #
    # HSTS without includeSubDomains or preload on purpose. Browsers cache
    # HSTS for the full max-age and it cannot be revoked early, so a
    # subdomain that is ever served over plain HTTP would become
    # unreachable with no quick way back. One year on the exact hosts
    # served here is the safe half of the trade.
    security-headers:
      headers:
        # HSTS is sent as a literal response header, not via stsSeconds.
        # Traefik only emits stsSeconds on a TLS connection, and TLS
        # terminates at Cloudflare -- Traefik sees plain HTTP and silently
        # omits it. The header was missing entirely until this was checked.
        # The client leg is always HTTPS via the tunnel, so asserting it
        # here is truthful.
        customResponseHeaders:
          Strict-Transport-Security: "max-age=31536000"
        contentTypeNosniff: true
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "strict-origin-when-cross-origin"

    # CrowdSec bouncer. Returns 403 to IPs CrowdSec has banned.
    #
    # stream mode, not live: Traefik pulls the decision list periodically
    # and answers from a local cache instead of asking CrowdSec on every
    # request. That keeps the hot path off the network, and -- more
    # importantly -- means a CrowdSec outage degrades to "no new bans"
    # rather than taking every web service down with it.
    #
    # The API key is a swarm secret read from disk, never inlined here:
    # this file is in git.
    crowdsec:
      plugin:
        crowdsec:
          enabled: true
          crowdsecMode: stream
          crowdsecLapiHost: crowdsec:8080
          crowdsecLapiScheme: http
          crowdsecLapiKeyFile: /run/secrets/crowdsec_bouncer_key
          # Trust the tunnel's forwarded client IP, or every ban would be
          # evaluated against cloudflared's address instead of the attacker.
          forwardedHeadersTrustedIPs:
            - 10.0.0.0/8
          # clientTrustedIPs are never blocked, and it must NOT contain the
          # overlay: every external request reaches Traefik from cloudflared
          # at 10.0.1.x, so trusting 10.0.0.0/8 here silently exempts the
          # entire internet and the bouncer blocks nothing. Only the LAN
          # belongs here. The overlay stays in forwardedHeadersTrustedIPs
          # above, which is a different thing: it decides whose
          # X-Forwarded-For is believed, not who is exempt.
          clientTrustedIPs:
            - 192.168.50.0/24

    # overseerr.<domain> still has a live DNS record pointing at this tunnel
    # (cloudflared's CLI has no "delete DNS route" command, and there's no
    # Cloudflare API token in this repo to do it directly) -- redirecting
    # here instead of leaving it to 404 once the overseerr service is gone.
    overseerr-to-seerr:
      redirectRegex:
        regex: "^https?://overseerr\\.(.*)"
        replacement: "https://seerr.${1}"
        permanent: true

    authentik:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        # Auth check responses are just redirects/headers -- caps the body
        # Traefik will read from the outpost, silencing the unlimited-size
        # DoS warning logged on every router using this middleware.
        maxResponseBodySize: 2097152
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version

  routers:
    # ttyd (web terminal) runs on the HOST via systemd, not in this stack --
    # same reasoning as plex/qbittorrent below: Traefik's swarmMode docker
    # provider can't discover it, so it gets a static entry too. Reached via
    # extra_hosts' host.docker.internal on the traefik service. Gated by its
    # own single-application Authentik provider (Admins group only) rather
    # than the domain-level one -- see the pihole/portainer/traefik-dashboard
    # setup for the same pattern.
    terminal:
      rule: 'Host(`terminal.{{ env "COMMON_DOMAIN" }}`)'
      entryPoints:
        - web
      middlewares:
        - authentik
      service: terminal

    # Pi-hole moved out of the Swarm stack to network_mode: host, so it
    # sees real client IPs instead of everything arriving as the
    # docker_gwbridge gateway. Host networking is exclusive -- it cannot
    # also join `edge` -- so it is addressed by gateway IP below rather
    # than by service name. Gated by its own single-application Authentik
    # provider (Admin group), same as portainer/traefik/terminal.
    pihole:
      rule: 'Host(`pihole.{{ env "COMMON_DOMAIN" }}`)'
      entryPoints:
        - web
      middlewares:
        - authentik
      service: pihole

    qbittorrent:
      rule: 'Host(`qbittorrent.{{ env "COMMON_DOMAIN" }}`)'
      entryPoints:
        - web
      middlewares:
        - authentik
      service: qbittorrent

    # sonarr/radarr/lazylibrarian moved out of the Swarm stack to exit
    # through the VPN like qbittorrent -- same reason they need static
    # entries here now instead of Swarm label auto-discovery.
    sonarr:
      rule: 'Host(`sonarr.{{ env "COMMON_DOMAIN" }}`)'
      entryPoints:
        - web
      middlewares:
        - authentik
      service: sonarr

    radarr:
      rule: 'Host(`radarr.{{ env "COMMON_DOMAIN" }}`)'
      entryPoints:
        - web
      middlewares:
        - authentik
      service: radarr

    lazylibrarian:
      rule: 'Host(`lazylibrarian.{{ env "COMMON_DOMAIN" }}`)'
      entryPoints:
        - web
      middlewares:
        - authentik
      service: lazylibrarian

    # Plex is deliberately NOT behind the authentik middleware: Plex's own
    # mobile/TV/cast apps authenticate via Plex's own OAuth flow and can't
    # complete a browser-redirect SSO challenge. Plex's own account system
    # is the auth gate here instead.
    plex:
      rule: 'Host(`plex.{{ env "COMMON_DOMAIN" }}`)'
      entryPoints:
        - web
      service: plex

    # Open WebUI is NOT behind the authentik middleware, deliberately.
    # It does real OIDC against Authentik itself (see
    # docker-compose.ai.yml), so forward-auth on top would mean signing in
    # twice for one app. Same reasoning as Immich and Audiobookshelf.
    #
    # Note what is absent: there is no router for ollama. Its API is
    # unauthenticated, so it is reachable only from Open WebUI over a
    # private bridge and has no route in or out of here.
    open-webui:
      rule: 'Host(`ai.{{ env "COMMON_DOMAIN" }}`)'
      entryPoints:
        - web
      service: open-webui

    # Tdarr rewrites files in the library, so it sits behind authentik with
    # no exception. It has no SSO of its own -- its only built-in gate is a
    # paid feature -- which means forward-auth is the whole of its security.
    tdarr:
      rule: 'Host(`tdarr.{{ env "COMMON_DOMAIN" }}`)'
      entryPoints:
        - web
      middlewares:
        - authentik
      service: tdarr

    # Read-write over the whole library and Storage. Admin tier.
    files:
      rule: 'Host(`files.{{ env "COMMON_DOMAIN" }}`)'
      entryPoints:
        - web
      middlewares:
        - authentik
      service: files

    # Read-only view of the media library: browse and download, nothing
    # else. Still behind authentik -- read-only is not the same as public,
    # and the library should not be enumerable by anyone with the URL.
    browse:
      rule: 'Host(`browse.{{ env "COMMON_DOMAIN" }}`)'
      entryPoints:
        - web
      middlewares:
        - authentik
      service: browse

    overseerr-to-seerr:
      rule: 'Host(`overseerr.{{ env "COMMON_DOMAIN" }}`)'
      entryPoints:
        - web
      middlewares:
        - overseerr-to-seerr
      # Never actually reached -- the redirectRegex middleware above returns
      # the 301 itself, but Traefik still requires every router to name a
      # valid service. Pointing at the real seerr service keeps this file
      # self-contained instead of reaching across to the Swarm provider.
      service: seerr-redirect-target

  services:
    # Direct docker_gwbridge IP, not host.docker.internal -- Docker's
    # "host-gateway" extra_hosts value resolves to the plain docker0 bridge
    # (172.17.0.1), which Traefik's overlay-only container isn't even
    # attached to. The real reachable gateway here is docker_gwbridge's,
    # confirmed via `ip route` inside the traefik container. ttyd on the
    # host binds specifically to this IP (see systemd/ttyd.service).
    terminal:
      loadBalancer:
        servers:
          - url: "http://172.20.0.1:7681"

    # qbittorrent/sonarr/radarr/lazylibrarian all share vpn-client's
    # network namespace (see docker-compose.download.yml), but each has
    # its own network alias there too -- addressed by its own name here,
    # not the generic vpn-client:<port> the shared identity also answers to.
    # Same docker_gwbridge gateway address ttyd uses, and for the same
    # reason: a host-networked process is not reachable by container name
    # from Traefik's overlay-only container, but the gateway IP is.
    # Pi-hole binds 0.0.0.0:80 under host networking, so it answers here.
    pihole:
      loadBalancer:
        servers:
          - url: "http://172.20.0.1:80"

    qbittorrent:
      loadBalancer:
        servers:
          - url: "http://qbittorrent:8080"

    sonarr:
      loadBalancer:
        servers:
          - url: "http://sonarr:8989"

    radarr:
      loadBalancer:
        servers:
          - url: "http://radarr:7878"

    lazylibrarian:
      loadBalancer:
        servers:
          - url: "http://lazylibrarian:5299"

    plex:
      loadBalancer:
        servers:
          - url: "http://plex:32400"

    open-webui:
      loadBalancer:
        servers:
          - url: "http://open-webui:8080"

    # 8265 is the web UI. 8266 is the server API the node talks to; it stays
    # on the overlay and is deliberately not routed.
    tdarr:
      loadBalancer:
        servers:
          - url: "http://tdarr:8265"

    files:
      loadBalancer:
        servers:
          - url: "http://files:3923"

    browse:
      loadBalancer:
        servers:
          - url: "http://browse:3923"

    seerr-redirect-target:
      loadBalancer:
        servers:
          - url: "http://seerr:5055"
