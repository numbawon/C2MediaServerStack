name: Repository privacy

# Only the full-history secret scan lives here now. The tracked-content
# check (deployment hostnames, addresses, personal paths) moved into
# scripts/ci-validate.sh, run by the Validate workflow -- it sat here on
# its own for two days and silently failed on every push in that window,
# because nobody runs a workflow that isn't part of the one script
# everyone actually runs before pushing. One island less.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-privacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p .ci-tools
          archive=".ci-tools/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C .ci-tools gitleaks

      - name: Scan complete Git history
        run: .ci-tools/gitleaks git --no-banner --redact --log-opts="--all" .
