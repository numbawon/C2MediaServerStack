# ---------------------------------------------------------------------
# Hermes Agent (Nous Research) -- an agent that writes files, runs
# commands and builds its own skills, pointed at the local Ollama.
#
# Deliberately sandboxed while it is being learned. It joins ONLY the
# private `ai` bridge, so it can reach Ollama by name and the internet
# through NAT, and nothing else in the stack: not Plex, not the *arrs,
# not Traefik. Its one mount is its own data directory, which is also
# where the image confines its writes (HERMES_WRITE_SAFE_ROOT=/opt/data).
# No Docker socket, no host paths, no media. Widen this only on purpose.
#
# The model is `hermes3-64k`, created in Ollama with num_ctx raised to
# 65536: Hermes refuses to start under 64k for tool use. Size Ollama's
# KV-cache settings for the installed GPU.
#
#   scripts/deploy.sh hermes
#   docker exec -it hermes hermes          # the terminal UI
#
# The dashboard is published on loopback only. Reach it over an SSH
# LAN rather than a Traefik route: it is an agent console, and this
# host publishes nothing without Authentik in front of it.
# ---------------------------------------------------------------------
services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    # The ntfy channel: server, topic and token. Written by hand, chmod
    # 600, git-ignored with the rest of secrets/.
    env_file:
      - secrets/hermes.env
    # Run the messaging gateway rather than idling: this is what listens
    # on the ntfy topic and answers there.
    command: ["gateway", "run"]
    environment:
      - TZ=${COMMON_TZ}
      # The image remaps its internal user to these and chowns /opt/data,
      # so files land owned by the host user rather than root. Starting it
      # with `--user` instead is rejected by its own entrypoint.
      - HERMES_UID=${COMMON_PUID}
      - HERMES_GID=${COMMON_PGID}
      - HERMES_DASHBOARD=1
      # Local inference is slow compared with a hosted API: a 64k prompt
      # can take minutes to process before the first token.
      - HERMES_API_TIMEOUT=1800
    volumes:
      - ${COMMON_CONFIG}/hermes:/opt/data
      # The Obsidian vault, synced by Syncthing (docker-compose.ai.yml).
      # Read-only, with one writable subfolder: the agent can search and
      # read every note and add its own under Hermes/, but cannot edit or
      # delete yours. Inside /opt/data, so it is also within
      # HERMES_WRITE_SAFE_ROOT. The nested mount only works if
      # obsidian/vault/Hermes already exists on the host (bootstrap.sh
      # creates it); otherwise Docker would create it root-owned.
      - ${COMMON_CONFIG}/obsidian/vault:/opt/data/vault:ro
      - ${COMMON_CONFIG}/obsidian/vault/Hermes:/opt/data/vault/Hermes
    ports:
      # The LAN address, not 0.0.0.0: this host also has docker bridges, the
      # swarm overlays and the VPN namespace, and the console has no business
      # on any of them. Its own login (dashboard.basic_auth in
      # .appdata/hermes/config.yaml) is the only gate in front of it, which is
      # the trade for reaching it from another machine in the house.
      - "${COMMON_LAN_IP}:9119:9119"
      # Traefik's way in, without joining `edge` (which would hand this
      # sandboxed agent the whole stack). Published on the docker_gwbridge
      # gateway address, reachable only from containers on this host, the
      # same trick as the Pi-hole and Home Assistant routes. 9119 is the
      # dashboard (Authentik-gated at hermes.<domain>), 8642 is the API
      # server the Android client talks to (hermes-api.<domain>, bearer
      # API_SERVER_KEY from secrets/hermes.env, deliberately not
      # Authentik-gated because the app cannot follow a browser redirect).
      - "${COMMON_DOCKER_GWBRIDGE_GATEWAY}:9119:9119"
      - "${COMMON_DOCKER_GWBRIDGE_GATEWAY}:8642:8642"
    networks:
      - ai
      # ntfy only. Its public hostname is behind Cloudflare Access, which a
      # container cannot log in to, and joining `edge` would hand this agent
      # the whole stack. This overlay carries ntfy and Hermes and nothing
      # else (declared in docker-stack.yml).
      - chat
    # Bounded so an agent loop cannot starve Tdarr's encoding or
    # AudioMuse's analysis, which share this machine.
    cpus: ${HERMES_CPUS}
    mem_limit: ${HERMES_MEMORY}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # What the s6 init needs to remap its user and chown the data volume
    # at boot, and nothing else.
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE, FOWNER]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ai:
    external: true
    name: mediastack-ai_ai
  chat:
    external: true
    name: mediastack_chat
