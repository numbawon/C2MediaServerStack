[defaults]
inventory = inventory.ini
# We already have real SSH keys and known_hosts entries between all three
# machines (set up before any of this existed) -- nothing here depends on
# host-key TOFU prompts to work, so the default (strict checking) stays on
# rather than disabling it for convenience.
host_key_checking = True
# Cuts noisy "[WARNING] Platform linux on host X is using the discovered
# Python interpreter" chatter -- Arch only ships one python3, there's
# nothing to discover.
interpreter_python = /usr/bin/python3
