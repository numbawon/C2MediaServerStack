# Deployed with: docker stack deploy -c docker-stack.yml mediastack
#
# This is the SWARM-managed portion of the stack. Two things live OUTSIDE this
# file, as plain (non-swarm) `docker compose` stacks, because Docker Swarm
# cannot do what they need:
#   - docker-compose.download.yml  (qBittorrent/Sonarr/Radarr/LazyLibrarian behind gluetun)
#       Swarm has no equivalent of `network_mode: service:x` (sharing another
#       container's network namespace), which is how qBittorrent's traffic is
#       forced through the VPN container. Only plain compose supports that.
#   - docker-compose.plex.yml      (Plex, GPU transcode)
#       Swarm stack files silently ignore the `devices:` key and don't
#       support NVIDIA GPU reservation the way plain `docker compose` does.
#
# Both of those attach to the `edge` overlay network below (created with
# --attachable) so Traefik, which lives in this swarm stack, can still route
# to them by service name.

# Log rotation for every service below, via the &logging anchor.
#
# Docker's json-file driver defaults to UNLIMITED size with no rotation, so
# a container's log grows until the disk fills. That is not hypothetical
# here: a container writing a video stream to stdout produced a 147 GB log
# and took the root filesystem to 64 KB free. `docker system df` does not
# count container logs, so nothing reported it.
#
# 10 MB x 3 files caps each service at 30 MB, so all 37 together cannot
# exceed about 1.1 GB no matter how noisy they get.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  # Created once by scripts/bootstrap.sh (`docker network create --driver
  # overlay --attachable edge`) rather than inline here, so the standalone
  # download/plex compose stacks and this stack file all reference the exact
  # same pre-existing network without Swarm trying to reconcile ownership of
  # it on every `docker stack deploy`.
  edge:
    external: true
  internal:
    driver: overlay

volumes:
  traefik_plugins:
    name: traefik_plugins
  traefik_logs:
    name: traefik_logs
  files_cfg:
    name: files_cfg
  browse_cfg:
    name: browse_cfg
  # Explicit `name:` on every volume so it doesn't get the `<stack-name>_`
  # prefix Swarm adds by default -- keeps scripts/backup-local.sh's volume
  # list stable regardless of what you name the stack at deploy time.
  authentik_data:
    name: authentik_data
  pihole_config:
    name: pihole_config
  pihole_dnsmasq:
    name: pihole_dnsmasq
  portainer_data:
    name: portainer_data
  postgres_data:
    name: postgres_data
  prometheus_data:
    name: prometheus_data
  grafana_data:
    name: grafana_data
  lidarr_config:
    name: lidarr_config
  bazarr_config:
    name: bazarr_config
  seerr_config:
    name: seerr_config
  prowlarr_config:
    name: prowlarr_config
  tautulli_config:
    name: tautulli_config
  navidrome_config:
    name: navidrome_config
  loki_data:
    name: loki_data
  # Owned by docker-compose.download.yml, mounted here read-only too --
  # named volumes aren't scoped to whichever compose file first created
  # them, and organizarr only needs to read each app's ApiKey out of
  # config.xml, never write.
  sonarr_config:
    name: sonarr_config
  radarr_config:
    name: radarr_config
  lazylibrarian_config:
    name: lazylibrarian_config
  organizarr_data:
    name: organizarr_data
  alertmanager_data:
    name: alertmanager_data
  # Holds ntfy's user.db (accounts + access tokens) and its message
  # cache. Losing this means re-issuing every token, including the one
  # in the phone's custom headers.
  ntfy_data:
    name: ntfy_data
  # Diun's record of which digest it last reported per image. Losing it
  # means one noisy run that re-reports everything as new.
  diun_data:
    name: diun_data
  # Written by scripts/verify-backups.sh, read by node-exporter's
  # textfile collector. Not backed up: it is derived state, regenerated
  # on the next verification run.
  node_exporter_textfile:
    name: node_exporter_textfile
  recyclarr_config:
    name: recyclarr_config
  beets_config:
  flood_data:
    # Explicit name so Swarm does not prefix it to mediastack_flood_data.
    # Same reason as the other pinned names here: scripts/backup-local.sh
    # lists volumes by name, and a prefix would silently drop this one from
    # the backup set.
    name: flood_data
  cleanuparr_config:
    name: cleanuparr_config
  audiobookshelf_config:
    name: audiobookshelf_config
  audiobookshelf_metadata:
    name: audiobookshelf_metadata
  # Immich runs its own Postgres (vector extensions the Authentik one does
  # not have) and its own Redis. immich_model_cache holds downloaded ML
  # models -- regenerable, but several GB, so not worth re-downloading.
  immich_db_data:
    name: immich_db_data
  immich_model_cache:
    name: immich_model_cache

secrets:
  postgres_password:
    external: true
  redis_password:
    external: true
  authentik_secret_key:
    external: true
  grafana_admin_password:
    external: true
  cloudflare_tunnel_token:
    external: true
  # ntfy access token used by alert-relay to publish. Create it after
  # ntfy's first boot (`ntfy token add`), see README.
  ntfy_relay_token:
    external: true
  crowdsec_bouncer_key:
    external: true

services:

  # ---------------------------------------------------------------------
  # Docker socket proxy -- the ONLY thing in this stack that touches the
  # real docker.sock. Never publish this on a host port.
  # ---------------------------------------------------------------------
  docker-socket-proxy:
    logging: *logging
    image: tecnativa/docker-socket-proxy:latest
    environment:
      TZ: ${COMMON_TZ}
      CONTAINERS: 1
      SERVICES: 1
      NETWORKS: 1
      TASKS: 1
      NODES: 1
      # Portainer's dashboard snapshot needs both of these (was 403ing on
      # "unable to snapshot volumes" / "unable to snapshot engine
      # information" without them) -- both are read-only info, no exec/write.
      # NB: the /info endpoint is gated by INFO, not SYSTEM -- SYSTEM is a
      # separate, broader flag this proxy also exposes.
      VOLUMES: 1
      INFO: 1
      # IMAGES is for Portainer's image list view. DISTRIBUTION (the
      # registry "is there a newer digest" check) was Watchtower-only and
      # is off now that Watchtower is gone -- Diun queries registries
      # directly over the internet, not through this proxy, so it needs
      # only CONTAINERS to discover which image refs are in use.
      IMAGES: 1
      DISTRIBUTION: 0
      # Portainer cannot list stacks without /swarm: it checks whether the
      # endpoint is a swarm manager before enumerating them, and the proxy
      # answered 403. The UI reports only "Unable to retrieve stacks",
      # which says nothing about which endpoint was refused -- same class
      # of failure as the VOLUMES/INFO note above.
      SWARM: 1
      # Stack detail views read secret metadata. The Docker API never
      # returns secret VALUES over the wire (they are write-only once
      # created), so this exposes names and timestamps, not contents.
      SECRETS: 1
      # Deliberately left off: this stack defines no docker configs, and
      # unlike secrets, config CONTENT is readable through the API.
      CONFIGS: 0
      # Portainer/Watchtower need write access to manage stacks/containers;
      # keep this scoped to POST only (no full unrestricted socket access).
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    deploy:
      placement:
        constraints: [node.role == manager]

  # ---------------------------------------------------------------------
  # Traefik -- reads the Docker API via the proxy above, never the raw
  # socket. No dashboard insecure-mode. Only ingress is the Cloudflare
  # Tunnel below; no host ports published at all.
  # ---------------------------------------------------------------------
  traefik:
    logging: *logging
    # Pinned to v3.7 deliberately -- see the go/no-go process for pinned
    # services in the README. Diun notifies when v3.8 ships; the bump is
    # a decision, not an automatic update.
    image: traefik:v3.7
    command:
      # Traefik v3 split the docker provider in two; swarmMode=true on the
      # classic docker provider was removed. Use the dedicated swarm provider.
      - --providers.swarm=true
      - --providers.swarm.endpoint=tcp://docker-socket-proxy:2375
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=edge
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.middlewares=force-forwarded-proto@file,ratelimit@file,security-headers@file,crowdsec@file
      # Trust X-Forwarded-For from the swarm overlay, which is where
      # cloudflared sits. Without this every access-log line records the
      # tunnel's own IP as the client, and CrowdSec would ban cloudflared
      # on the first attack -- taking the whole site offline instead of the
      # attacker. Scoped to the overlay: a LAN host cannot spoof through it.
      - --entrypoints.web.forwardedheaders.trustedips=10.0.0.0/8
      # Plugin is fetched at startup and cached in traefik_plugins, so a
      # restart does not depend on the internet. Verified to load on
      # v3.7.12 in a throwaway container before being put here: a plugin
      # that fails to load stops Traefik from starting at all, which would
      # take every web service down rather than just the bouncer.
      - --experimental.plugins.crowdsec.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      - --experimental.plugins.crowdsec.version=v1.7.1
      - --api.dashboard=true
      - --metrics.prometheus=true
      - --log.level=INFO
      # Access logs exist for CrowdSec, which reads them to decide who is
      # attacking. JSON because the parser needs structured fields, and
      # keepingRequestHeaders is limited to the two that matter: the real
      # client IP arrives in Cf-Connecting-Ip since every request reaches
      # Traefik from the tunnel, so without it every attacker looks like
      # cloudflared and CrowdSec would ban the tunnel itself.
      - --accesslog=true
      - --accesslog.filepath=/logs/access.log
      - --accesslog.format=json
      - --accesslog.fields.headers.names.Cf-Connecting-Ip=keep
      - --accesslog.fields.headers.names.User-Agent=keep
      # Authentik's forward-auth sets this on requests it has authenticated.
      # Logging it lets CrowdSec tell a signed-in person from an anonymous
      # scanner, which is the difference between a false positive and a
      # real detection.
      - --accesslog.fields.headers.names.X-Authentik-Username=keep
    environment:
      - TZ=${COMMON_TZ}
      # Traefik v3.1's swarm provider client defaults to a hardcoded old
      # Docker API version (1.24) and doesn't negotiate up; this host's
      # Engine rejects anything below 1.40. Pin an explicit version well
      # within both bounds instead of relying on negotiation.
      - DOCKER_API_VERSION=1.44
      # traefik/dynamic.yml uses {{ env "COMMON_DOMAIN" }} -- that's Traefik's
      # own Go-template env function reading THIS container's process
      # environment, a completely different mechanism from the ${COMMON_DOMAIN}
      # substitution .env does into this YAML file. Without this, the
      # template silently rendered as empty string (Host(`plex.`) instead of
      # Host(`plex.example.com`)), so the plex/qbittorrent static routes
      # never matched any real request.
      - COMMON_DOMAIN=${COMMON_DOMAIN}
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_logs:/logs
      - traefik_plugins:/plugins-storage
    networks:
      - edge
      - internal
    secrets:
      - crowdsec_bouncer_key
    deploy:
      placement:
        constraints: [node.role == manager]
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.traefik.rule=Host(`traefik.${COMMON_DOMAIN}`)"
        - "traefik.http.routers.traefik.entrypoints=web"
        - "traefik.http.routers.traefik.service=api@internal"
        - "traefik.http.routers.traefik.middlewares=authentik@file"
        - "traefik.http.services.traefik-dummy.loadbalancer.server.port=8080"

  # ---------------------------------------------------------------------
  # Cloudflare Tunnel -- only ingress path. Outbound-only connection to
  # Cloudflare edge, no inbound ports opened on the router at all.
  # Tunnel + DNS routes are created once via `cloudflared tunnel create`
  # and `cloudflared tunnel route dns` (see README) before this deploys.
  # ---------------------------------------------------------------------
  cloudflared:
    logging: *logging
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run
    # Same musl AAAA problem Seerr hit, and it takes the WHOLE STACK down
    # rather than one app: Docker's embedded resolver forwards to the
    # host's nameserver, which is the router, and the router SERVFAILs
    # every AAAA query. cloudflared is musl-based, so a SERVFAIL on
    # either half of a dual A/AAAA lookup fails the lookup entirely --
    # it cannot resolve region1.v2.argotunnel.com, never reaches the
    # edge, and every hostname returns Cloudflare error 1033.
    #
    # Pi-hole answers AAAA correctly (filter-AAAA), so point at it
    # directly. By LAN IP because that is stable, unlike a Swarm task's
    # overlay address.
    dns:
      - ${COMMON_LAN_IP}
    environment:
      - TZ=${COMMON_TZ}
      - TUNNEL_TOKEN_FILE=/run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    networks:
      - edge
    deploy:
      replicas: 1

  # ---------------------------------------------------------------------
  # Authentik -- SSO / forward-auth gate for everything else.
  # First-boot: create admin user, then create a "Proxy Provider" (forward
  # auth, single application / all apps) + Outpost in the Authentik UI.
  # This cannot be scripted via env vars -- see README.
  # ---------------------------------------------------------------------
  authentik-server:
    logging: *logging
    image: ghcr.io/goauthentik/server:2026.8
    command: server
    environment:
      - TZ=${COMMON_TZ}
      - AUTHENTIK_SECRET_KEY=file:///run/secrets/authentik_secret_key
      - AUTHENTIK_POSTGRESQL__HOST=postgres
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD=file:///run/secrets/postgres_password
      - AUTHENTIK_REDIS__HOST=redis
      - AUTHENTIK_REDIS__PASSWORD=file:///run/secrets/redis_password
      # Authentik only sees Traefik's IP, never the real client IP directly,
      # so it must trust forwarded headers (Host, X-Forwarded-Proto) from
      # the overlay network Traefik connects over, or it can't tell it's
      # being accessed over HTTPS -> CSRF origin-scheme mismatch on save.
      # Not exposed on any host port, so trusting the whole internal range
      # here carries no external exposure risk.
      - AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS=0.0.0.0/0
    secrets:
      - authentik_secret_key
      - postgres_password
      - redis_password
    volumes:
      - authentik_data:/media
    networks:
      - edge
      - internal
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.authentik.rule=Host(`auth.${COMMON_DOMAIN}`)"
        - "traefik.http.routers.authentik.entrypoints=web"
        - "traefik.http.services.authentik.loadbalancer.server.port=9000"

  authentik-worker:
    logging: *logging
    image: ghcr.io/goauthentik/server:2026.8
    command: worker
    environment:
      - TZ=${COMMON_TZ}
      - AUTHENTIK_SECRET_KEY=file:///run/secrets/authentik_secret_key
      - AUTHENTIK_POSTGRESQL__HOST=postgres
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD=file:///run/secrets/postgres_password
      - AUTHENTIK_REDIS__HOST=redis
      - AUTHENTIK_REDIS__PASSWORD=file:///run/secrets/redis_password
    secrets:
      - authentik_secret_key
      - postgres_password
      - redis_password
    volumes:
      - authentik_data:/media
    networks:
      - internal

  postgres:
    logging: *logging
    # Major-version jumps can break the on-disk data format -- pinned to
    # :16 (patches float), same reasoning as Traefik/Authentik above.
    image: postgres:16
    environment:
      - TZ=${COMMON_TZ}
      - POSTGRES_USER=authentik
      - POSTGRES_DB=authentik
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    logging: *logging
    image: redis:7-alpine
    environment:
      - TZ=${COMMON_TZ}
    command: >
      sh -c 'redis-server --requirepass "$$(cat /run/secrets/redis_password)"'
    secrets:
      - redis_password
    networks:
      - internal

  # ---------------------------------------------------------------------
  # Pi-hole is NOT here. It moved to docker-compose.dns.yml with
  # network_mode: host so it sees real LAN client IPs -- as a Swarm
  # service, Docker's NAT rewrote every query's source to the
  # docker_gwbridge gateway and Pi-hole saw the whole LAN as one client.
  # It also now starts with the Docker daemon rather than whenever Swarm
  # converges, and `docker stack rm` no longer takes LAN DNS down.
  #
  # Its Traefik router/service are static entries in
  # traefik/dynamic/dynamic.yml, since a host-networked container cannot
  # join the `edge` overlay for label discovery.
  # ---------------------------------------------------------------------

  portainer:
    logging: *logging
    # Business Edition -- licensed. Preserves portainer_data/admin account
    # across the CE->EE image swap per Portainer's own upgrade docs; log
    # back in after this deploys and it'll prompt for the license key.
    image: portainer/portainer-ee:sts
    environment:
      - TZ=${COMMON_TZ}
    command: -H tcp://docker-socket-proxy:2375
    volumes:
      - portainer_data:/data
    networks:
      - edge
      - internal
    deploy:
      placement:
        constraints: [node.role == manager]
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.portainer.rule=Host(`portainer.${COMMON_DOMAIN}`)"
        - "traefik.http.routers.portainer.entrypoints=web"
        - "traefik.http.routers.portainer.middlewares=authentik@file"
        - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  lidarr:
    logging: *logging
    image: linuxserver/lidarr:latest
    environment:
      - PUID=${COMMON_PUID}
      - PGID=${COMMON_PGID}
      - TZ=${COMMON_TZ}
    volumes:
      - lidarr_config:/config
      - ${COMMON_MEDIA}/Music:/music
      - ${COMMON_DOWNLOADS}:/downloads
    networks:
      - edge
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.lidarr.rule=Host(`lidarr.${COMMON_DOMAIN}`)"
        - "traefik.http.routers.lidarr.entrypoints=web"
        - "traefik.http.routers.lidarr.middlewares=authentik@file"
        - "traefik.http.services.lidarr.loadbalancer.server.port=8686"

  bazarr:
    logging: *logging
    image: linuxserver/bazarr:latest
    environment:
      - PUID=${COMMON_PUID}
      - PGID=${COMMON_PGID}
      - TZ=${COMMON_TZ}
    volumes:
      - bazarr_config:/config
      - ${COMMON_MEDIA}/Movies:/movies
      - ${COMMON_MEDIA}/TV:/tv
    networks:
      - edge
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.bazarr.rule=Host(`bazarr.${COMMON_DOMAIN}`)"
        - "traefik.http.routers.bazarr.entrypoints=web"
        - "traefik.http.routers.bazarr.middlewares=authentik@file"
        - "traefik.http.services.bazarr.loadbalancer.server.port=6767"

  seerr:
    logging: *logging
    image: ghcr.io/seerr-team/seerr:latest
    # No PUID/PGID -- unlike the LinuxServer images, this runs as the
    # baked-in `node` user (UID 1000), which happens to already match
    # COMMON_PUID/COMMON_PGID on this host.
    # init: true -- runs the container's PID 1 as a real init (tini) so
    # signals/zombie reaping work correctly; the image expects this.
    init: true
    environment:
      - TZ=${COMMON_TZ}
    volumes:
      - seerr_config:/app/config
    # Resolve through Pi-hole rather than Docker's default path out to the
    # router. Seerr is Alpine/musl, and musl fails a whole hostname lookup
    # with EAI_AGAIN when the AAAA half returns SERVFAIL -- which is exactly
    # what api.themoviedb.org and discover.provider.plex.tv do upstream, at
    # every public resolver. That surfaced as a storm of 500s in the UI and
    # "[TMDB] Failed to fetch ..." in the logs while the host itself
    # resolved both names fine (glibc tolerates it). Pi-hole answers AAAA
    # with NODATA locally (see filter-AAAA above), so the lookup succeeds on
    # the A record. Addressed by LAN IP because that is stable, unlike the
    # overlay address of a Swarm task.
    dns:
      - ${COMMON_LAN_IP}
    networks:
      - edge
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.seerr.rule=Host(`seerr.${COMMON_DOMAIN}`)"
        - "traefik.http.routers.seerr.entrypoints=web"
        - "traefik.http.routers.seerr.middlewares=authentik@file"
        - "traefik.http.services.seerr.loadbalancer.server.port=5055"

  prowlarr:
    logging: *logging
    image: linuxserver/prowlarr:latest
    environment:
      - PUID=${COMMON_PUID}
      - PGID=${COMMON_PGID}
      - TZ=${COMMON_TZ}
    volumes:
      - prowlarr_config:/config
    networks:
      - edge
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${COMMON_DOMAIN}`)"
        - "traefik.http.routers.prowlarr.entrypoints=web"
        - "traefik.http.routers.prowlarr.middlewares=authentik@file"
        - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"

  # Solves Cloudflare's JS challenge for the public indexers that would
  # otherwise just fail in Prowlarr. Prowlarr speaks to it natively:
  # Settings -> Indexers -> Indexer Proxies -> FlareSolverr, then tag only
  # the indexers that actually need it. Tagging everything sends every
  # search through a headless browser for no reason.
  #
  # Deliberately on `edge` next to Prowlarr and NOT behind the VPN. The
  # cf_clearance cookie FlareSolverr returns is bound to the IP and
  # User-Agent that solved the challenge, so it has to exit from the same
  # address Prowlarr does or the cookie is rejected the moment Prowlarr
  # tries to use it. (Prowlarr sits outside the VPN on purpose -- see
  # "Why Prowlarr is not behind the VPN" in the README.)
  #
  # No Traefik labels on purpose: this is an internal API with no UI worth
  # exposing, so it stays reachable only from inside the overlay.
  flaresolverr:
    logging: *logging
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      - TZ=${COMMON_TZ}
      - LOG_LEVEL=info
    networks:
      - edge
    deploy:
      resources:
        limits:
          # The only service in this stack with a memory ceiling, and the
          # only one that needs one: each request spawns a headless
          # Chromium, and upstream has a long history of memory growth
          # under sustained use. Everything else here has a predictable
          # footprint. If it does run away, Swarm kills and restarts just
          # this container instead of letting it lean on the whole host.
          memory: 1536M

  # Reads Plex's own watch/library stats via Plex's API + a token generated
  # through Tautulli's own first-boot wizard (Plex account sign-in) -- can't
  # be scripted, same as every other app's first-boot in this stack.
  tautulli:
    logging: *logging
    image: linuxserver/tautulli:latest
    environment:
      - PUID=${COMMON_PUID}
      - PGID=${COMMON_PGID}
      - TZ=${COMMON_TZ}
    volumes:
      - tautulli_config:/config
    networks:
      - edge
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.tautulli.rule=Host(`tautulli.${COMMON_DOMAIN}`)"
        - "traefik.http.routers.tautulli.entrypoints=web"
        - "traefik.http.routers.tautulli.middlewares=authentik@file"
        - "traefik.http.services.tautulli.loadbalancer.server.port=8181"

  # ---------------------------------------------------------------------
  # Navidrome -- Subsonic-API music streaming. `internal`, not `edge`, same
  # trust move already made for grafana: ND_EXTAUTH_TRUSTEDSOURCES only
  # accepts the X-authentik-username header from that subnet, so nothing
  # but Traefik can forge it. Two routers below split the one hostname:
  # the browser UI goes through the authentik forwardAuth gate like every
  # other admin app; /rest/* (the actual Subsonic API path phone apps use)
  # skips it entirely, same reasoning as Plex -- a phone app can't
  # complete a browser SSO redirect, so it authenticates with its own
  # password (set once, per person, in Navidrome's own account settings)
  # instead.
  # ---------------------------------------------------------------------
  navidrome:
    logging: *logging
    # Official image, not a LinuxServer one -- Navidrome ignores PUID/PGID
    # entirely (that's an LSIO-only convention); it wants the container's
    # actual user set instead, which is what `user:` below does.
    image: deluan/navidrome:latest
    user: "${COMMON_PUID}:${COMMON_PGID}"
    environment:
      - TZ=${COMMON_TZ}
      - ND_EXTAUTH_USERHEADER=X-authentik-username
      - ND_EXTAUTH_TRUSTEDSOURCES=10.0.2.0/24
    volumes:
      - navidrome_config:/data
      - ${COMMON_MEDIA}/Music:/music:ro
    networks:
      # `internal`, not `edge`, for the same reason as grafana:
      # ND_EXTAUTH_USERHEADER above makes navidrome trust
      # X-authentik-username, so anything able to reach navidrome:4533
      # directly could forge it and sign in as any user.
      - internal
    deploy:
      labels:
        - "traefik.enable=true"
        # See grafana: overrides the global swarm provider network so
        # Traefik stops warning and stops relying on a fallback.
        - "traefik.docker.network=mediastack_internal"
        - "traefik.http.routers.navidrome.rule=Host(`navidrome.${COMMON_DOMAIN}`) && !PathPrefix(`/rest`)"
        - "traefik.http.routers.navidrome.entrypoints=web"
        - "traefik.http.routers.navidrome.middlewares=authentik@file"
        - "traefik.http.routers.navidrome-api.rule=Host(`navidrome.${COMMON_DOMAIN}`) && PathPrefix(`/rest`)"
        - "traefik.http.routers.navidrome-api.entrypoints=web"
        - "traefik.http.services.navidrome.loadbalancer.server.port=4533"

  # ---------------------------------------------------------------------
  # Organizarr -- a small hub for the settings that are actually painful
  # to keep straight by hand across the *arr apps (auth method,
  # download-client host/port, Prowlarr's app/indexer sync). Talks to
  # each app's real API using a key read from that app's own config
  # volume (read-only) -- never a config-file edit. Auto-detection is
  # tried first and re-tried lazily (handles a fresh deploy where this
  # container starts before the app it depends on); if an app's key
  # genuinely can't be auto-detected (volume not mounted, unusual setup),
  # a manual override can be entered in its own UI instead, persisted in
  # organizarr_data.
  #
  # Extracted to its own public repo/image:
  # https://github.com/numbawon/organizarr -- pulled like everything
  # else now, no local build step. organizarr_data is covered by the
  # backup scripts -- it holds any manually-entered key overrides, real
  # state worth not losing even though most keys are just re-read from
  # volumes already backed up under their owning app.
  #
  # SECURITY: this app can rewrite authentication settings and
  # download-client credentials across the whole stack. Bind it to an
  # Admins-only Authentik application (see README), not the
  # any-authenticated-user default the rest of these apps use.
  organizarr:
    logging: *logging
    image: ghcr.io/numbawon/organizarr:latest
    # CONTAINER label, not deploy.labels. Diun runs both a swarm provider
    # (reads service labels) and a docker provider (reads container
    # labels), so excluding this image needs the label in BOTH places or
    # the docker provider keeps reporting it. Exactly the service-vs-
    # container label distinction that made Watchtower's opt-outs
    # decorative -- see the Updates section of the README.
    labels:
      - "diun.enable=false"
    environment:
      - TZ=${COMMON_TZ}
      - SONARR_URL=http://sonarr:8989
      - SONARR_CONFIG_PATH=/data/sonarr/config.xml
      - RADARR_URL=http://radarr:7878
      - RADARR_CONFIG_PATH=/data/radarr/config.xml
      - LIDARR_URL=http://lidarr:8686
      - LIDARR_CONFIG_PATH=/data/lidarr/config.xml
      - PROWLARR_URL=http://prowlarr:9696
      - PROWLARR_CONFIG_PATH=/data/prowlarr/config.xml
      - BAZARR_URL=http://bazarr:6767
      - BAZARR_CONFIG_PATH=/data/bazarr/config/config.yaml
      - LAZYLIBRARIAN_URL=http://lazylibrarian:5299
      - LAZYLIBRARIAN_CONFIG_PATH=/data/lazylibrarian/config.ini
      # Reachability only -- Cleanuparr has its own API but not the
      # shared *arr settings shape, so there is nothing to edit here. It
      # earns a slot because it acts on the same download clients and
      # queues, so "is it actually up" belongs on the same page. No
      # CONFIG_PATH: it needs no API key for its health endpoint.
      - CLEANUPARR_URL=http://cleanuparr:11011
    volumes:
      - sonarr_config:/data/sonarr:ro
      - radarr_config:/data/radarr:ro
      - lidarr_config:/data/lidarr:ro
      - prowlarr_config:/data/prowlarr:ro
      - bazarr_config:/data/bazarr:ro
      - lazylibrarian_config:/data/lazylibrarian:ro
      - organizarr_data:/state
    networks:
      - edge
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.organizarr.rule=Host(`organizarr.${COMMON_DOMAIN}`)"
        - "traefik.http.routers.organizarr.entrypoints=web"
        # Ordinary authentik@file middleware, but the gate behind it is
        # NOT the ordinary one: organizarr has its own single-application
        # Authentik provider bound to the Admins group, so this host
        # resolves to that instead of the any-authenticated-user
        # domain-level application. Same pattern as pihole/portainer/
        # traefik-dashboard/terminal. Nothing here expresses that -- the
        # restriction lives entirely in Authentik, which is why it is
        # called out in the README rather than only in this file.
        - "traefik.http.routers.organizarr.middlewares=authentik@file"
        - "traefik.http.services.organizarr.loadbalancer.server.port=8000"
        # Excluded from Diun. This image is built from a repo in this
        # household and deployed as soon as it is pushed, so an "update
        # available" notification is always describing a change that was
        # already made deliberately, minutes earlier. Diun's value is
        # telling you about OTHER people's releases; noise about your own
        # is how a notification channel gets ignored.
        - "diun.enable=false"

  homer:
    logging: *logging
    image: b4bz/homer:latest
    environment:
      - PUID=${COMMON_PUID}
      - PGID=${COMMON_PGID}
      - TZ=${COMMON_TZ}
    volumes:
      # Whole directory, not individual files -- Homer writes nothing here
      # at runtime (pure static config/assets), so no named volume needed
      # either.
      - ./homer:/www/assets:ro
    networks:
      - edge
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.homer.rule=Host(`homer.${COMMON_DOMAIN}`)"
        - "traefik.http.routers.homer.entrypoints=web"
        - "traefik.http.routers.homer.middlewares=authentik@file"
        - "traefik.http.services.homer.loadbalancer.server.port=8080"

  # ---------------------------------------------------------------------
  # Metrics sources for Prometheus -- neither is meant to be browsed, no
  # Traefik labels, internal network only.
  # ---------------------------------------------------------------------
  node-exporter:
    logging: *logging
    image: prom/node-exporter:latest
    environment:
      - TZ=${COMMON_TZ}
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - node_exporter_textfile:/textfile:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      # Textfile collector: scripts/verify-backups.sh writes .prom files
      # into this volume and node-exporter serves them as ordinary
      # metrics. That is how a systemd-timer job that runs once a week
      # gets to be alertable in Prometheus at all.
      #
      # A named volume rather than a host path deliberately -- a host
      # bind mount would need a root-created directory outside the repo,
      # and everything else here stays inside Docker's world.
      - --collector.textfile.directory=/textfile
    networks:
      - internal
    deploy:
      placement:
        constraints: [node.role == manager]

  # Deliberate exception to "only docker-socket-proxy touches docker.sock" --
  # cAdvisor's per-container metrics need it directly, no way around that.
  # Kept read-only and internal-network-only to limit the blast radius.
  cadvisor:
    logging: *logging
    image: gcr.io/cadvisor/cadvisor:latest
    environment:
      - TZ=${COMMON_TZ}
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    deploy:
      placement:
        constraints: [node.role == manager]

  prometheus:
    logging: *logging
    image: prom/prometheus:latest
    environment:
      - TZ=${COMMON_TZ}
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus:/etc/prometheus:ro
    networks:
      - edge
      - internal
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.prometheus.rule=Host(`prometheus.${COMMON_DOMAIN}`)"
        - "traefik.http.routers.prometheus.entrypoints=web"
        - "traefik.http.routers.prometheus.middlewares=authentik@file"
        - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  # ---------------------------------------------------------------------
  # Alertmanager -- routes what Prometheus fires. Gated by Authentik
  # like the rest of the monitoring tier: silencing an alert is a
  # privileged action, so this is not a household-tier page.
  # ---------------------------------------------------------------------
  alertmanager:
    logging: *logging
    image: prom/alertmanager:latest
    environment:
      - TZ=${COMMON_TZ}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # Needed for the silence links in the UI to be correct behind a
      # reverse proxy.
      - --web.external-url=https://alertmanager.${COMMON_DOMAIN}
      # Default retention is 120h, which is SHORTER than the 168h
      # repeat_interval on the image-update route. Alertmanager warns
      # about this at startup because forgetting an alert it is still
      # meant to be suppressing makes it re-notify early. 336h covers
      # the longest repeat_interval with room to spare.
      - --data.retention=336h
    volumes:
      - alertmanager_data:/alertmanager
      - ./alertmanager:/etc/alertmanager:ro
    networks:
      - edge
      - internal
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.alertmanager.rule=Host(`alertmanager.${COMMON_DOMAIN}`)"
        - "traefik.http.routers.alertmanager.entrypoints=web"
        - "traefik.http.routers.alertmanager.middlewares=authentik@file"
        - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"

  # ---------------------------------------------------------------------
  # alert-relay -- turns Alertmanager's fixed JSON webhook into a
  # readable ntfy notification. In-repo on purpose (see the module
  # docstring); stdlib only, so a stock python image runs it with
  # nothing installed and there is no image to build or registry to
  # depend on. No ingress: only Alertmanager talks to it.
  # ---------------------------------------------------------------------
  alert-relay:
    logging: *logging
    image: python:3-alpine
    command: python /app/relay.py
    environment:
      - TZ=${COMMON_TZ}
      - NTFY_URL=http://ntfy:80
      - NTFY_TOPIC=alerts
      - NTFY_TOKEN_FILE=/run/secrets/ntfy_relay_token
      # Unbuffered, or the container logs stay empty until the process
      # exits and debugging a silent alert path becomes guesswork.
      - PYTHONUNBUFFERED=1
    secrets:
      - ntfy_relay_token
    volumes:
      - ./alert-relay:/app:ro
    networks:
      - internal

  # ---------------------------------------------------------------------
  # ntfy -- push notifications. The ONE internet-reachable service that
  # is deliberately NOT behind Authentik's forward-auth gate: the
  # Android app holds a persistent connection and cannot complete a
  # browser login redirect, exactly like Plex and Navidrome's /rest/*.
  #
  # Protected instead by (1) Cloudflare Access service token at the
  # edge, (2) auth-default-access=deny-all in ntfy/server.yml, (3) no
  # published port, ingress only via the tunnel. See ntfy/server.yml.
  # ---------------------------------------------------------------------
  ntfy:
    logging: *logging
    image: binwiederhier/ntfy:latest
    command: serve
    environment:
      - TZ=${COMMON_TZ}
      # Set here, not in server.yml: ntfy does no env substitution when
      # reading that file, so ${COMMON_DOMAIN} would be taken literally.
      - NTFY_BASE_URL=https://ntfy.${COMMON_DOMAIN}
    volumes:
      - ntfy_data:/var/lib/ntfy
      - ./ntfy:/etc/ntfy:ro
    networks:
      - edge
      - internal
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.ntfy.rule=Host(`ntfy.${COMMON_DOMAIN}`)"
        - "traefik.http.routers.ntfy.entrypoints=web"
        # NO authentik@file middleware, and that is deliberate -- adding
        # it breaks push delivery to the mobile app entirely. Do not
        # "fix" this by making it consistent with the other routers.
        - "traefik.http.services.ntfy.loadbalancer.server.port=80"

  # ---------------------------------------------------------------------
  # Diun -- registry update notifier, the replacement for Watchtower.
  # Reads Swarm SERVICES and standalone containers through the socket
  # proxy, checks registries for newer digests, and exposes findings as
  # Prometheus metrics. It has no write access and cannot restart
  # anything: every update is your decision.
  # ---------------------------------------------------------------------
  diun:
    logging: *logging
    image: crazymax/diun:latest
    # --config passed explicitly rather than relying on an env var:
    # Diun has two separate config systems (kong CLI flags, which are
    # unprefixed, and config-file keys, which transpose to DIUN_*), and
    # the flag has NO default. Get this wrong and Diun starts happily
    # with zero providers and silently never checks anything.
    command: serve --config /etc/diun/diun.yml
    environment:
      - TZ=${COMMON_TZ}
      - LOG_LEVEL=info
    volumes:
      - diun_data:/data
      - ./diun:/etc/diun:ro
    networks:
      - internal
    deploy:
      placement:
        constraints: [node.role == manager]

  grafana:
    logging: *logging
    image: grafana/grafana:latest
    environment:
      - TZ=${COMMON_TZ}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      # Trusts the X-authentik-* headers Traefik's authentik forwardAuth
      # middleware already injects on every request that reaches this
      # container -- no separate Authentik OAuth2 provider/app needed.
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=X-authentik-username
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_HEADERS=Email:X-authentik-email Name:X-authentik-name
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true
      - GF_AUTH_PROXY_SYNC_TTL=60
      # Belt-and-suspenders: only trust the proxy headers from the
      # `internal` overlay subnet grafana now lives on (see `networks:`
      # below) -- redundant with that network move today, but keeps the
      # header trust from silently reopening if grafana ever gets
      # rejoined to `edge` later.
      - GF_AUTH_PROXY_WHITELIST=10.0.2.0/24
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Viewer
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      # `internal`, not `edge` -- the *arr apps and everything else that's
      # edge-only could otherwise reach grafana:3000 directly and forge
      # the X-authentik-username header the auth-proxy setting above
      # trusts. Prometheus (grafana's only datasource) and traefik are
      # both already on `internal` too, so nothing else needs to change.
      - internal
    deploy:
      labels:
        - "traefik.enable=true"
        # Traefik's global --providers.swarm.network is `edge`, and grafana
        # is deliberately not on it (see `networks:` above). Without this
        # override Traefik logs "Could not find network edge" on every
        # reconcile and falls back to whichever network it finds first --
        # right today, and silently wrong if another network is ever added.
        #
        # It really is `traefik.docker.network`, not `traefik.swarm.network`:
        # the v3 swarm provider still reads the docker-provider key, and the
        # swarm-prefixed one is silently ignored. Verified by removing each
        # in turn and watching whether the warning came back.
        - "traefik.docker.network=mediastack_internal"
        - "traefik.http.routers.grafana.rule=Host(`grafana.${COMMON_DOMAIN}`)"
        - "traefik.http.routers.grafana.entrypoints=web"
        - "traefik.http.routers.grafana.middlewares=authentik@file"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # ---------------------------------------------------------------------
  # Loki + Promtail -- log aggregation alongside the Prometheus/Grafana
  # metrics stack. No Traefik route: only Grafana talks to Loki, over
  # `internal`, same trust boundary as the Prometheus datasource.
  # ---------------------------------------------------------------------
  loki:
    logging: *logging
    image: grafana/loki:latest
    environment:
      - TZ=${COMMON_TZ}
    # Directory mount, not single-file -- same reasoning as promtail below.
    # Custom config over the image's baked-in default: default ingestion
    # rate limit (4MB/s) 429s immediately when promtail backfills every
    # container's full log history in one burst on first deploy.
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki:/etc/loki:ro
      - loki_data:/loki
    networks:
      - internal

  # Discovers and tails every container's logs through the socket proxy's
  # existing CONTAINERS permission (already granted above for Portainer/
  # Watchtower) instead of bind-mounting /var/lib/docker/containers or the
  # raw socket -- same "never touch docker.sock directly" rule as
  # everything else here, cAdvisor being the one deliberate exception.
  # ---------------------------------------------------------------------
  # Recyclarr -- syncs TRaSH Guides quality profiles and custom formats
  # into Sonarr/Radarr. No web UI and no API: it is a cron'd one-shot, so
  # there is no hostname and no Authentik application to create. Nothing
  # to gate means nothing to get wrong.
  #
  # On `edge` because sonarr/radarr are network aliases registered there
  # by the gluetun vpn-client container.
  # ---------------------------------------------------------------------
  recyclarr:
    logging: *logging
    # Recyclarr publishes NO :latest tag at all, only major-version tags;
    # :latest gets "manifest unknown" and the task is rejected in a loop.
    #
    # Must be 8, not 7: the official config templates track the v8 schema
    # (their header says schemas.recyclarr.dev/v8/config-schema.json) and
    # use `quality_profiles: - trash_id:`, which v7 cannot parse. On 7 the
    # sync dies with a bare "Exception at line 30".
    #
    # Diun watches :8 and will notify on 8.x releases; moving to 9 stays a
    # decision, and would need the configs in recyclarr/configs/ rechecked
    # against whatever schema 9 expects.
    image: ghcr.io/recyclarr/recyclarr:8
    environment:
      - TZ=${COMMON_TZ}
      - CRON_SCHEDULE=@daily
      # Do not scaffold a starter recyclarr.yml into the volume; the real
      # config is the read-only mount below.
      - RECYCLARR_CREATE_CONFIG=false
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
    volumes:
      # Volume for Recyclarr's own regenerable state (its clone of the
      # TRaSH guides repo); read-only directory mount for the config it
      # actually acts on.
      - recyclarr_config:/config
      - ./recyclarr/configs:/config/configs:ro
    networks:
      - edge

  # ---------------------------------------------------------------------
  # Cleanuparr -- removes stalled, blocked and known-malware downloads
  # from the *arr queues and triggers a fresh search. Admin tier: it can
  # delete things.
  #
  # On `edge` for the same reason as Recyclarr, plus it needs qbittorrent,
  # which is also a vpn-client alias.
  #
  # NO authentik@file middleware, deliberately. Cleanuparr does real OIDC
  # against Authentik itself, so forward-auth on top meant signing in
  # twice for one app. Same choice as Immich, Audiobookshelf and Open
  # WebUI. Access control did not move to the app: the `Cleanuparr`
  # application in Authentik is bound to the Admin group, so the
  # authorization step still decides who gets in.
  #
  # Its OIDC "redirect url" setting takes the app's BASE url
  # (https://cleanuparr.<domain>), not a callback path. Cleanuparr
  # appends /api/auth/oidc/callback itself, and giving it the full path
  # produces a doubled URI that fails as redirect_uri mismatch.
  # ---------------------------------------------------------------------
  cleanuparr:
    logging: *logging
    image: ghcr.io/cleanuparr/cleanuparr:latest
    environment:
      - TZ=${COMMON_TZ}
      - PORT=11011
      - PUID=${COMMON_PUID}
      - PGID=${COMMON_PGID}
    volumes:
      - cleanuparr_config:/config
    networks:
      - edge
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.cleanuparr.rule=Host(`cleanuparr.${COMMON_DOMAIN}`)"
        - "traefik.http.routers.cleanuparr.entrypoints=web"
        # No authentik@file -- see the block comment above.
        - "traefik.http.services.cleanuparr.loadbalancer.server.port=11011"

  # ---------------------------------------------------------------------
  # copyparty (files) -- ADMIN file manager. Read-write over Media and
  # Storage, so it sits behind authentik with no exception.
  #
  # NOT Filebrowser: that project was archived on 2026-09-01 with known
  # unfixed security advisories, which is disqualifying for something
  # internet-reachable holding write access to the whole library.
  #
  # Permissions are enforced in two places that do not depend on each
  # other. Authentik decides who reaches the route at all; the volume
  # spec decides what they can do once inside. The read-only sibling
  # below adds a third, the kernel.
  # ---------------------------------------------------------------------
  files:
    image: copyparty/ac:latest
    command:
      # copyparty has no accounts: Authentik is the login, and everyone
      # arrives already authenticated. Left alone its UI still shows a
      # "Login for more" button leading to a password form that nothing can
      # satisfy, so both buttons are pointed at Authentik instead. Logout
      # goes through the outpost so it ends the SSO session rather than a
      # copyparty session that does not exist.
      - -v
      - /w/media:media:A
      - -v
      - /w/storage:storage:A
      - --idp-login
      - https://auth.${COMMON_DOMAIN}/
      - --idp-login-t
      - Switch account
      - --idp-logout
      - https://files.${COMMON_DOMAIN}/outpost.goauthentik.io/sign_out
      # Trust the overlay. copyparty's --xff-src defaults to loopback only
      # (127.0.0.0/8, ::1/128), so every forwarded header from Traefik --
      # which reaches it from 10.0.1.x -- was silently ignored. That made
      # copyparty believe the request scheme was http while the browser sent
      # Origin: https, and its CORS check rejected every write with
      # "rejected by cors-check". Renames, uploads and deletes all failed.
      # copyparty publishes no ports and is only reachable through Traefik,
      # so trusting private IPs here is the same trust the route already has.
      - --xff-src=lan
      # TLS terminates at Cloudflare, so Traefik forwards plain HTTP and
      # copyparty saw scheme "http" while the browser's Origin said https.
      # Its CORS check then treats every write as cross-origin, and --acam
      # defaults to GET,HEAD -- so renames, uploads and deletes were refused.
      # These services are only reachable through the HTTPS tunnel, so https
      # is the truthful assumption when the header does not survive.
      - --xf-proto-fb=https
      - --http-only          # TLS terminates at Traefik
      - -e2dsa               # index for search and upload-undo
      - --no-robots
    volumes:
      - ${COMMON_MEDIA}:/w/media
      - /mnt/Storage:/w/storage
      - files_cfg:/cfg
    environment:
      - TZ=${COMMON_TZ}
    networks:
      - edge
    logging: *logging
    deploy:
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.http.routers.files.rule=Host(`files.${COMMON_DOMAIN}`)
        - traefik.http.routers.files.entrypoints=web
        - traefik.http.routers.files.middlewares=authentik@file
        - traefik.http.services.files.loadbalancer.server.port=3923

  # ---------------------------------------------------------------------
  # copyparty (browse) -- READ-ONLY view of the media library, for people
  # who should be able to find and download a file but never change one.
  #
  # Three independent things have to hold for that to be true, and the
  # last one is the only one that cannot be misconfigured:
  #   1. the volume grants "r" (read/list/download) and nothing else
  #   2. Authentik still gates who reaches the route
  #   3. the bind mount is :ro, so the kernel refuses writes even if
  #      copyparty is compromised or the volume spec is wrong
  #
  # Storage is not mounted here at all. Absent beats read-only.
  # ---------------------------------------------------------------------
  browse:
    image: copyparty/ac:latest
    command:
      - -v
      - /w/media:media:r
      - --idp-login
      - https://auth.${COMMON_DOMAIN}/
      - --idp-login-t
      - Switch account
      - --idp-logout
      - https://browse.${COMMON_DOMAIN}/outpost.goauthentik.io/sign_out
      # Trust the overlay. copyparty's --xff-src defaults to loopback only
      # (127.0.0.0/8, ::1/128), so every forwarded header from Traefik --
      # which reaches it from 10.0.1.x -- was silently ignored. That made
      # copyparty believe the request scheme was http while the browser sent
      # Origin: https, and its CORS check rejected every write with
      # "rejected by cors-check". Renames, uploads and deletes all failed.
      # copyparty publishes no ports and is only reachable through Traefik,
      # so trusting private IPs here is the same trust the route already has.
      - --xff-src=lan
      # TLS terminates at Cloudflare, so Traefik forwards plain HTTP and
      # copyparty saw scheme "http" while the browser's Origin said https.
      # Its CORS check then treats every write as cross-origin, and --acam
      # defaults to GET,HEAD -- so renames, uploads and deletes were refused.
      # These services are only reachable through the HTTPS tunnel, so https
      # is the truthful assumption when the header does not survive.
      - --xf-proto-fb=https
      - --http-only
      - --no-robots
      - --no-del
      - --no-mv
    volumes:
      - ${COMMON_MEDIA}:/w/media:ro
      - browse_cfg:/cfg
    environment:
      - TZ=${COMMON_TZ}
    networks:
      - edge
    logging: *logging
    deploy:
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.http.routers.browse.rule=Host(`browse.${COMMON_DOMAIN}`)
        - traefik.http.routers.browse.entrypoints=web
        - traefik.http.routers.browse.middlewares=authentik@file
        - traefik.http.services.browse.loadbalancer.server.port=3923

  # ---------------------------------------------------------------------
  # Flood -- alternative web UI for qBittorrent. Media-management tier.
  #
  # Does not replace qBittorrent's own UI, it sits beside it. Both talk to
  # the same daemon, so a torrent added in one appears in the other.
  #
  # Lives in the Swarm stack rather than the download compose because it
  # needs no VPN: it is a UI that calls qBittorrent's HTTP API, not
  # something that talks to trackers or peers. Putting it behind gluetun
  # would route its traffic through the tunnel for no benefit and tie its
  # uptime to the VPN.
  #
  # It reaches qbittorrent by the network alias vpn-client registers on
  # `edge` (see docker-compose.download.yml), not by container name -- the
  # four apps behind the VPN have no network identity of their own.
  #
  # No credentials are configured, and that is not an oversight:
  # qBittorrent's WebUI\AuthSubnetWhitelist is 10.0.1.0/24, the edge
  # overlay, so anything on that network already reaches its API
  # unauthenticated. Storing a password here would add a secret without
  # adding a barrier. Worth knowing that this cuts both ways: every
  # container on `edge` can drive qBittorrent, which is why the gate that
  # matters is Traefik's, below.
  # ---------------------------------------------------------------------
  flood:
    logging: *logging
    image: jesec/flood:latest
    # The image ships uid 1001 ("download"), which owns nothing else here
    # and cannot write a freshly created named volume. Running it as the
    # stack's own PUID keeps one uid across every service and matches the
    # volume, which is chowned to the same. Without this it restart-loops
    # on "Failed to access runtime directory /config".
    user: "${COMMON_PUID}:${COMMON_PGID}"
    environment:
      - TZ=${COMMON_TZ}
      - HOME=/config
      # auth=none means Flood keeps no user database of its own. Safe ONLY
      # because authentik@file is in front of it; without that middleware
      # this is an unauthenticated torrent client on the internet.
      - FLOOD_OPTION_auth=none
      - FLOOD_OPTION_host=0.0.0.0
      - FLOOD_OPTION_port=3000
      - FLOOD_OPTION_rundir=/config
      - FLOOD_OPTION_qburl=http://qbittorrent:8080
      # qbuser and qbpass are required by Flood's config schema even though
      # they are not used: qBittorrent's AuthSubnetWhitelist covers the
      # edge overlay, so the request is already authorised by source
      # address. Omitting them fails validation with an opaque
      # "invalid_union" listing Deluge, because Flood cannot tell which
      # client was meant from an incomplete option set. The value is a
      # placeholder, not a credential.
      - FLOOD_OPTION_qbuser=admin
      - FLOOD_OPTION_qbpass=subnet-whitelisted
    volumes:
      - flood_data:/config
    networks:
      - edge
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.flood.rule=Host(`flood.${COMMON_DOMAIN}`)"
        - "traefik.http.routers.flood.entrypoints=web"
        # Load-bearing, see the auth=none note above.
        - "traefik.http.routers.flood.middlewares=authentik@file"
        - "traefik.http.services.flood.loadbalancer.server.port=3000"

  # ---------------------------------------------------------------------
  # beets -- music tag and artwork repair. Admin tier.
  #
  # Runs as a long-lived container doing nothing until told to, because
  # every useful beets operation is a one-off command. There is no web UI
  # and no schedule: retagging a library on a timer is how good tags get
  # silently overwritten by a bad match at 3am.
  #
  #   docker exec -it $(docker ps -qf name=mediastack_beets) beet stats
  #   docker exec -it $(docker ps -qf name=mediastack_beets) beet import -A /music
  #
  # CONFIGURED FOR TAGS AND ARTWORK ONLY. beets/config.yaml sets copy:no
  # and move:no, so it never relocates or renames a file. That matters
  # here: the Artist/Albums/Live/Singles structure is hand-built, and
  # beets' default behaviour is to replace it with its own layout. Lidarr
  # is held off the same structure for the same reason.
  #
  # The music mount is read-WRITE, unavoidably -- writing tags means
  # writing the files. Navidrome's stays read-only.
  # ---------------------------------------------------------------------
  beets:
    logging: *logging
    image: lscr.io/linuxserver/beets:latest
    environment:
      - TZ=${COMMON_TZ}
      - PUID=${COMMON_PUID}
      - PGID=${COMMON_PGID}
    volumes:
      - beets_config:/config
      # Read-write: tag repair rewrites the audio files themselves.
      - ${COMMON_MEDIA}/Music:/music
      # The config is version-controlled rather than living in the volume,
      # so the copy:no / move:no guard is visible in git rather than being
      # a setting somebody could change without leaving a trace.
      - ./beets/config.yaml:/config/config.yaml:ro
    networks:
      - edge
    deploy:
      labels:
        - "traefik.enable=false"

  # ---------------------------------------------------------------------
  # Audiobookshelf -- audiobooks and podcasts. Household tier.
  #
  # NO authentik@file middleware, deliberately. It has native OIDC and a
  # mobile app that holds its own session; a forward-auth gate would
  # bounce every API call to a login redirect the app cannot complete.
  # Same reasoning as Plex, Navidrome's /rest/* and ntfy. Configure OIDC
  # in its own Settings -> Authentication after first boot (see README).
  # ---------------------------------------------------------------------
  audiobookshelf:
    logging: *logging
    image: ghcr.io/advplyr/audiobookshelf:latest
    environment:
      - TZ=${COMMON_TZ}
    volumes:
      # NB the lowercase b: the real library is "Audiobooks" (489 GB).
      # An "AudioBooks" directory was briefly created here by mistake and
      # this mount pointed at the empty one, so the library looked empty.
      - ${COMMON_MEDIA}/Audiobooks:/audiobooks
      - ${COMMON_MEDIA}/Podcasts:/podcasts
      # Ebooks, read through the same app rather than a second service.
      # Audiobookshelf has an ebook reader and can email a book to a
      # Kindle, so a 14-file library does not justify standing up
      # Calibre-Web or Kavita beside it. Revisit if this grows into comics
      # or manga, which Kavita handles far better.
      # LazyLibrarian already writes here: its ebook_dir is /books.
      - ${COMMON_MEDIA}/EBooks:/books
      - audiobookshelf_config:/config
      - audiobookshelf_metadata:/metadata
    networks:
      - edge
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.audiobookshelf.rule=Host(`audiobookshelf.${COMMON_DOMAIN}`)"
        - "traefik.http.routers.audiobookshelf.entrypoints=web"
        - "traefik.http.services.audiobookshelf.loadbalancer.server.port=80"

  # ---------------------------------------------------------------------
  # Immich -- photos and video. Household tier.
  #
  # Four services, not one. Immich needs a Postgres with vector
  # extensions (pgvector/vectorchord) for search embeddings, which the
  # Authentik Postgres does not have and cannot be given without changing
  # that image. It also wants its own Redis. Sharing either would couple
  # Immich's uptime to SSO's, so both are separate on purpose.
  #
  # Like Audiobookshelf: NO authentik@file middleware. Native OIDC plus a
  # mobile app that cannot complete a browser redirect.
  # ---------------------------------------------------------------------
  immich-server:
    logging: *logging
    image: ghcr.io/immich-app/immich-server:release
    environment:
      - TZ=${COMMON_TZ}
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=immich
      - DB_DATABASE_NAME=immich
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - REDIS_HOSTNAME=immich-redis
    volumes:
      # /data is Immich's MANAGED store (library/, upload/, thumbs/,
      # encoded-video/, backups/). It is opaque -- Immich does not scan
      # it for pre-existing files, it owns the layout. So it gets its own
      # directory rather than being pointed at Pictures, where it would
      # scatter six internal folders across 228 existing photos and still
      # not import a single one of them.
      #
      # It lives under COMMON_APPDATA, not COMMON_MEDIA. It is Immich's
      # bookkeeping, not a library: it has no business sitting next to
      # Movies and TV, and Plex and the *arr scanners should never walk
      # it. It still needs to be on the array rather than in a named
      # volume, because every photo anyone uploads lands here and the OS
      # SSD has no room to grow into.
      - ${COMMON_APPDATA}/immich:/data
      # The existing photos are exposed read-only as an External Library
      # instead, which is the mechanism for indexing files in place.
      # Add it in Immich under Administration -> External Libraries with
      # the path /external/pictures. Read-only so an accidental delete in
      # the UI cannot reach the originals.
      - ${COMMON_MEDIA}/Pictures:/external/pictures:ro
    networks:
      - edge
      - internal
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.immich.rule=Host(`immich.${COMMON_DOMAIN}`)"
        - "traefik.http.routers.immich.entrypoints=web"
        # No authentik@file -- see the block comment above.
        - "traefik.http.services.immich.loadbalancer.server.port=2283"

  immich-machine-learning:
    logging: *logging
    image: ghcr.io/immich-app/immich-machine-learning:release
    environment:
      - TZ=${COMMON_TZ}
    volumes:
      - immich_model_cache:/cache
    networks:
      - internal
    deploy:
      resources:
        limits:
          # Model inference is memory-hungry and will happily take
          # everything. Capped so a large import cannot OOM the host and
          # let the kernel pick a victim from the rest of the stack.
          memory: 4096M

  immich-postgres:
    logging: *logging
    # Pinned to the exact image Immich ships with. This is NOT
    # interchangeable with postgres:16 above -- it carries the vector
    # extensions Immich's search depends on, and Immich checks for them
    # at startup.
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      - TZ=${COMMON_TZ}
      - POSTGRES_USER=immich
      - POSTGRES_DB=immich
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - immich_db_data:/var/lib/postgresql/data
    networks:
      - internal

  immich-redis:
    logging: *logging
    image: docker.io/valkey/valkey:8-bookworm
    environment:
      - TZ=${COMMON_TZ}
    networks:
      - internal

  # ---------------------------------------------------------------------
  # Blackbox exporter -- probes the stack from OUTSIDE the tunnel, the
  # way a real user reaches it.
  #
  # Everything else Prometheus scrapes lives on the internal network, on
  # the server side of Cloudflare. During the 2026-08-27 outage that left
  # every target reporting up while nothing was actually reachable. This
  # is the only check that would have caught it.
  #
  # On `edge` for outbound internet, and pinned to Pi-hole for DNS for
  # the same musl AAAA reason as cloudflared -- a probe that cannot
  # resolve would report an outage that is not happening.
  # ---------------------------------------------------------------------
  blackbox-exporter:
    logging: *logging
    image: prom/blackbox-exporter:latest
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    environment:
      - TZ=${COMMON_TZ}
    dns:
      - ${COMMON_LAN_IP}
    volumes:
      - ./blackbox:/etc/blackbox:ro
    networks:
      - edge
      - internal

  promtail:
    logging: *logging
    image: grafana/promtail:latest
    environment:
      - TZ=${COMMON_TZ}
    # Directory mount, not a single-file one -- see the repo-wide fix for
    # why (single-file bind mounts go stale on host-side edits/recreates).
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail:/etc/promtail:ro
    networks:
      - internal
