# Standalone (non-swarm) compose -- deployed with:
#   ./scripts/deploy.sh ai
#
# Lives outside the Swarm stack for the same reason Plex does: `docker
# stack deploy` ignores GPU reservations. Swarm silently drops the
# `deploy.resources.reservations.devices` block, so an Ollama service
# deployed into the stack would come up, work, and quietly run every
# model on the CPU at a fraction of the speed with nothing reporting it.
#
# GPU wiring: `driver: nvidia` is the same pattern Plex already uses and
# needs no daemon.json change. nvidia-container-toolkit's prestart hook
# injects the driver libraries and nvidia-smi into the container.
#
# One trap worth writing down: this injection only works on glibc images.
# The same block against an Alpine image passes the /dev/nvidia* nodes
# through but injects no libraries, so nvidia-smi is simply absent and
# CUDA never initialises. Ollama and Open WebUI are both Debian-based, so
# this is fine here, but do not assume it transfers to an Alpine variant.
#
# Routing: Traefik's docker provider runs in swarmMode and only watches
# swarm services, so it cannot see these containers' labels. Open WebUI
# is routed by a static entry in traefik/dynamic/dynamic.yml instead,
# same as plex and qbittorrent.

name: mediastack-ai

services:
  # ---------------------------------------------------------------------
  # Ollama -- model runtime. Deliberately NOT on the `edge` overlay and
  # deliberately without a Traefik route: its API has no authentication
  # of any kind, and anything that can reach port 11434 can load models,
  # run inference and delete them. Only Open WebUI needs to talk to it,
  # so it lives on a private bridge that nothing else joins.
  # ---------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      - TZ=${COMMON_TZ}
      # Models are multi-GB each and the OS SSD has under 80 GB free, so
      # they go on the array with Immich's store rather than into a named
      # volume under /var/lib/docker.
      - OLLAMA_MODELS=/models
      # This GPU has 8 GB. An 8B model at Q4 sits around 5.5 GB loaded,
      # which leaves very little room, and Plex wants the same card for
      # NVENC transcoding. These three settings are what stop the two
      # from fighting:
      #
      #   MAX_LOADED_MODELS=1  a second model would not fit, and Ollama's
      #                        default is to keep several resident.
      #   NUM_PARALLEL=1       each parallel slot gets its own KV cache;
      #                        the default of 4 multiplies context memory
      #                        by four and OOMs the card mid-generation.
      #   KEEP_ALIVE=5m        VRAM is released when idle, so a transcode
      #                        starting later is not competing with a
      #                        model nobody is talking to.
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=5m
    volumes:
      - ${COMMON_APPDATA}/ollama:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ai
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Open WebUI -- the browser front end and the only thing exposed.
  # ---------------------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    depends_on:
      - ollama
    environment:
      - TZ=${COMMON_TZ}
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_URL=https://ai.${COMMON_DOMAIN}
      # Signs session cookies. Without it Open WebUI generates a new one
      # on every start and logs everybody out on each restart.
      - WEBUI_SECRET_KEY=${OPENWEBUI_SECRET_KEY}

      # --- Native OIDC, not forward-auth -------------------------------
      # Same choice as Immich and Audiobookshelf: Open WebUI has real
      # OIDC, so putting authentik@file in front as well would mean two
      # separate logins for one app.
      #
      # Role mapping reuses the groups-claim pattern from Portainer.
      # Authentik must be configured to emit a `groups` claim on this
      # provider's scope, or every user lands with no role and cannot
      # sign in. That is a scope-mapping setting, not a default.
      - ENABLE_OAUTH_SIGNUP=true
      - ENABLE_LOGIN_FORM=false
      - OAUTH_PROVIDER_NAME=Authentik
      - OPENID_PROVIDER_URL=https://auth.${COMMON_DOMAIN}/application/o/open-webui/.well-known/openid-configuration
      - OAUTH_CLIENT_ID=${OPENWEBUI_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OPENWEBUI_CLIENT_SECRET}
      - ENABLE_OAUTH_ROLE_MANAGEMENT=true
      - OAUTH_ROLES_CLAIM=groups
      # Real Authentik group names (Admin / Contributor / Metrics /
      # Family), matching the access-tier table in the README. This lands
      # AI on the Media-management tier. Adding Family here is the
      # one-line change that opens it to the whole household, which is
      # worth thinking about first: everyone shares one 8 GB card that
      # Plex also transcodes on.
      - OAUTH_ALLOWED_ROLES=Admin,Contributor
      - OAUTH_ADMIN_ROLES=Admin
    volumes:
      - open_webui_data:/app/backend/data
    networks:
      - ai
      - edge
    restart: unless-stopped

networks:
  edge:
    external: true   # the attachable overlay created by the swarm stack
  # Local bridge, not the overlay. Ollama's unauthenticated API should be
  # reachable from exactly one container and nothing else.
  ai:
    driver: bridge

volumes:
  # Explicit name so it isn't prefixed by the compose project name --
  # keeps the backup scripts' volume list stable. See the same comment in
  # docker-compose.download.yml.
  open_webui_data:
    name: open_webui_data
