# Standalone (non-swarm) compose -- deployed with:
#   ./scripts/deploy.sh ai
#
# Lives outside the Swarm stack for the same reason Plex does: `docker
# stack deploy` ignores GPU reservations. Swarm silently drops the
# `deploy.resources.reservations.devices` block, so an Ollama service
# deployed into the stack would come up, work, and quietly run every
# model on the CPU at a fraction of the speed with nothing reporting it.
#
# GPU wiring: `driver: nvidia` is the same pattern Plex already uses and
# needs no daemon.json change. nvidia-container-toolkit's prestart hook
# injects the driver libraries and nvidia-smi into the container.
#
# One trap worth writing down: this injection only works on glibc images.
# The same block against an Alpine image passes the /dev/nvidia* nodes
# through but injects no libraries, so nvidia-smi is simply absent and
# CUDA never initialises. Ollama and Open WebUI are both Debian-based, so
# this is fine here, but do not assume it transfers to an Alpine variant.
#
# Routing: Traefik's docker provider runs in swarmMode and only watches
# swarm services, so it cannot see these containers' labels. Open WebUI
# is routed by a static entry in traefik/dynamic/dynamic.yml instead,
# same as plex and qbittorrent.

# Log rotation, same reasoning as docker-stack.yml: the json-file driver
# defaults to unlimited size with no rotation, and a container writing to
# stdout filled the root disk once already.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

name: mediastack-ai

services:
  # ---------------------------------------------------------------------
  # Ollama -- model runtime. Deliberately NOT on the `edge` overlay and
  # deliberately without a Traefik route: its API has no authentication
  # of any kind, and anything that can reach port 11434 can load models,
  # run inference and delete them. Only Open WebUI needs to talk to it,
  # so it lives on a private bridge that nothing else joins.
  # ---------------------------------------------------------------------
  ollama:
    logging: *logging
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      - TZ=${COMMON_TZ}
      # Models are large, so keep them with managed application data rather
      # than in an opaque named volume under /var/lib/docker.
      - OLLAMA_MODELS=/models
      # Tune these in .env for available VRAM and any GPU sharing with Plex.
      #
      #   MAX_LOADED_MODELS=1  a second model would not fit, and Ollama's
      #                        default is to keep several resident.
      #   NUM_PARALLEL=1       each parallel slot gets its own KV cache;
      #                        the default of 4 multiplies context memory
      #                        by four and OOMs the card mid-generation.
      #   KEEP_ALIVE=5m        VRAM is released when idle, so a transcode
      #                        starting later is not competing with a
      #                        model nobody is talking to.
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE}
      # Flash attention allows a quantized KV cache for long-context agents.
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE}
    ports:
      # Loopback ONLY. This exists so host-side tooling (the foundry-delegate
      # skill) can reach the OpenAI-compatible API at /v1, and that skill
      # refuses any endpoint that is not 127.0.0.1, localhost or ::1 unless
      # explicitly overridden. Binding 0.0.0.0 here would publish an
      # unauthenticated inference API to the LAN.
      - "127.0.0.1:11434:11434"
    volumes:
      - ${COMMON_APPDATA}/ollama:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${COMMON_NVIDIA_DEVICE_COUNT}
              capabilities: [gpu]
    networks:
      - ai
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Kokoro -- text to speech, OpenAI-compatible.
  #
  # Open WebUI ships two LOCAL TTS options and neither works here:
  #
  #   Kokoro.js (browser)  runs the model client-side on WebGPU/WASM. It
  #                        loads, enumerates voices, reports success, and
  #                        plays silence. No error at any layer.
  #   Transformers (server) is SpeechT5, and its speaker embeddings come
  #                        from cmu-arctic-xvectors, a SCRIPT-based dataset.
  #                        datasets v4 removed script support, so it dies
  #                        with "Dataset scripts are no longer supported"
  #                        and returns 500. Upstream bug, not config.
  #
  # This is the same Kokoro model the browser option uses, run server-side
  # at full precision. Open WebUI POSTs text and receives a WAV, so none of
  # the browser's WASM, WebGPU, dtype or voice-name variables apply, and it
  # works identically on a phone.
  #
  # CPU image on purpose. Kokoro is 82M parameters and fast enough on this
  # host, while a GPU TTS model can evict an active Ollama model for little
  # practical gain.
  #
  # On the `ai` bridge only, same reasoning as Ollama: an unauthenticated
  # inference API that exactly one container needs to reach. No Traefik
  # router, nothing published to the LAN.
  # ---------------------------------------------------------------------
  kokoro:
    logging: *logging
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro
    environment:
      - TZ=${COMMON_TZ}
    volumes:
      - ${COMMON_APPDATA}/kokoro:/app/api/src/models
    networks:
      - ai
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Open WebUI -- the browser front end and the only thing exposed.
  # ---------------------------------------------------------------------
  open-webui:
    logging: *logging
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    depends_on:
      - ollama
    environment:
      - TZ=${COMMON_TZ}
      - OLLAMA_BASE_URL=http://ollama:11434

      # Text to speech via the kokoro service above. "openai" here names
      # the PROTOCOL, not the company -- it is the OpenAI-compatible
      # /v1/audio/speech shape, served locally. Nothing leaves the box, and
      # the key is required by the client library but never checked.
      #
      # THESE ARE SEEDS, NOT SETTINGS. Open WebUI reads AUDIO_TTS_* only
      # when the key is absent from its own config table; after that the
      # stored value wins and the variable is ignored completely. On this
      # instance they were inert from the moment they were written: the
      # table already held engine="transformers" and an api_base_url of
      # api.openai.com, so every request kept landing in _tts_transformers
      # and 500ing no matter what compose said. They are kept so a FRESH
      # deploy comes up correct.
      #
      # To change it on a running instance, change it in Admin Settings ->
      # Audio, or write the config table directly:
      #   audio.tts.engine=openai  audio.tts.model=kokoro
      #   audio.tts.openai.api_base_url=http://kokoro:8880/v1
      #   audio.tts.voice=af_heart
      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://kokoro:8880/v1
      - AUDIO_TTS_OPENAI_API_KEY=not-needed
      - AUDIO_TTS_MODEL=kokoro
      - AUDIO_TTS_VOICE=af_heart
      - WEBUI_URL=https://ai.${COMMON_DOMAIN}
      # Signs session cookies. Without it Open WebUI generates a new one
      # on every start and logs everybody out on each restart.
      - WEBUI_SECRET_KEY=${OPENWEBUI_SECRET_KEY}

      # Programmatic API access for automation clients. Keep Open WebUI auth
      # enabled; callers must present a user-scoped API key/token.
      - ENABLE_API_KEYS=true
      - CUSTOM_API_KEY_HEADER=X-OpenWebUI-Key
      - USER_PERMISSIONS_FEATURES_API_KEYS=true

      # --- Native OIDC, not forward-auth -------------------------------
      # Same choice as Immich and Audiobookshelf: Open WebUI has real
      # OIDC, so putting authentik@file in front as well would mean two
      # separate logins for one app.
      #
      # Role mapping reuses the groups-claim pattern from Portainer.
      # Authentik must be configured to emit a `groups` claim on this
      # provider's scope, or every user lands with no role and cannot
      # sign in. That is a scope-mapping setting, not a default.
      - ENABLE_OAUTH_SIGNUP=true
      - ENABLE_LOGIN_FORM=false
      - OAUTH_PROVIDER_NAME=Authentik
      - OPENID_PROVIDER_URL=https://auth.${COMMON_DOMAIN}/application/o/open-webui/.well-known/openid-configuration
      - OAUTH_CLIENT_ID=${OPENWEBUI_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OPENWEBUI_CLIENT_SECRET}
      - ENABLE_OAUTH_ROLE_MANAGEMENT=true
      - OAUTH_ROLES_CLAIM=groups
      # Real Authentik group names (Admin / Contributor / Metrics /
      # Family), matching the access-tier table in the README. Family is
      # included: this is open to the whole household. Everyone shares one
      # 8 GB card that Plex also transcodes on, and MAX_LOADED_MODELS=1
      # below means concurrent requests queue rather than run in parallel.
      - OAUTH_ALLOWED_ROLES=Admin,Contributor,Family
      - OAUTH_ADMIN_ROLES=Admin

      # --- Household visibility ----------------------------------------
      # This instance exists partly to teach kids how to use AI well, so
      # an admin needs to be able to read back what was actually asked.
      # Three settings decide whether that is possible at all, and the
      # defaults on two of them make it not.
      #
      # ENABLE_ADMIN_CHAT_ACCESS is already true by default; it is stated
      # explicitly so a future upstream default change is visible here
      # rather than silently removing the capability.
      - ENABLE_ADMIN_CHAT_ACCESS=true
      #
      # CHAT_TEMPORARY is the one that matters most. Left on, any user can
      # flip "Temporary Chat" in the UI and that conversation is never
      # written to the database at all. Not hidden, not private: absent.
      # No amount of admin access recovers it.
      - USER_PERMISSIONS_CHAT_TEMPORARY=false
      #
      # And a saved chat that can be deleted is only a record until
      # someone decides otherwise.
      - USER_PERMISSIONS_CHAT_DELETE=false
      #
      # Open WebUI tells users nothing about any of the above. Since the
      # point here is teaching people to notice how monitored these tools
      # are, having this instance quietly be the exception would teach the
      # opposite. dismissible:false keeps it visible rather than something
      # you click away once and never see again. This is the same notice a
      # school or employer tenant would show, which is the lesson.
      - >-
        WEBUI_BANNERS=[{"id":"monitored","type":"info","title":"These
        conversations are saved","content":"An administrator can read
        anything you type here. That is true of nearly every AI tool at a
        school or a job too, whether or not it says so. Assume someone can
        read it, and write accordingly.","dismissible":false,"timestamp":0}]
    volumes:
      - ${COMMON_CONFIG}/open_webui:/app/backend/data
    networks:
      - ai
      - edge
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Syncthing -- keeps the Obsidian vault in step with the phone (and any
  # other device) as plain files, so Hermes can read the same notes.
  # LiveSync was rejected for exactly that reason: it keeps notes in
  # CouchDB, which the agent could not read without a bridge.
  #
  # Files, not a database: ${COMMON_CONFIG}/obsidian/vault is the vault.
  # Hermes mounts it too (docker-compose.hermes.yml), read-only, with a
  # single writable Hermes/ subfolder, so an agent run can add notes but
  # cannot edit or delete yours, and a bad edit cannot sync to every device.
  #
  # Sync itself needs no public hostname: devices meet through Syncthing's
  # global discovery and relays. 22000 is published on the LAN address only,
  # for direct connections from the phone at home. Nothing is forwarded on
  # the router. The admin GUI is the only web surface: syncthing.<domain>,
  # Admin-only Authentik application plus a GUI password of its own, because
  # `edge` is shared and other containers there could otherwise reach 8384.
  #
  # Pinned to the 2 series: major bumps migrate the on-disk database and
  # this is data you cannot regenerate, so it stays out of roll-unpinned.sh
  # and updates are a deliberate act.
  # ---------------------------------------------------------------------
  syncthing:
    image: syncthing/syncthing:2
    container_name: syncthing
    hostname: syncthing
    logging: *logging
    restart: unless-stopped
    # Runs as the host account directly (no PUID remap), so no capabilities
    # are needed at all.
    user: "${COMMON_PUID}:${COMMON_PGID}"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      - HOME=/var/syncthing
      - STGUIADDRESS=0.0.0.0:8384
      # No default "Sync" folder; the vault is added explicitly.
      - STNODEFAULTFOLDER=1
    volumes:
      - ${COMMON_CONFIG}/syncthing:/var/syncthing
      - ${COMMON_CONFIG}/obsidian/vault:/vault
    ports:
      - "${COMMON_LAN_IP}:22000:22000/tcp"
      - "${COMMON_LAN_IP}:22000:22000/udp"
    networks:
      - edge

networks:
  edge:
    external: true   # the attachable overlay created by the swarm stack
  # Local bridge, not the overlay. Ollama's unauthenticated API is
  # reachable only from the containers joined here by name: open-webui,
  # kokoro, and AudioMuse-AI's flask and worker (docker-compose.audiomuse.yml,
  # for Instant Playlist). Never attach it to `edge`.
  ai:
    driver: bridge
