global:
  scrape_interval: 15s
  # How often alerting rules are evaluated. Left at the scrape interval
  # so a `for: 5m` in rules/ means five real minutes, not five
  # evaluations of some slower loop.
  evaluation_interval: 15s

# Rule files are a directory glob, not a single-file mount -- single-file
# bind mounts go stale on host-side edits (repo-wide convention).
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # Blackbox probes: these hit the PUBLIC hostnames through Cloudflare,
  # not internal service names, which is the entire point.
  #
  # Targets come from files, not inline, for two reasons. Prometheus does
  # NO environment substitution in this file (same trap as ntfy's
  # server.yml), so ${COMMON_DOMAIN} would be taken literally. And the
  # real domain and LAN IP stay out of version control -- targets/*.json
  # is git-ignored, with a .example alongside it.
  #
  # Generate the real files with scripts/gen-prometheus-targets.sh.
  - job_name: blackbox-gated
    metrics_path: /probe
    params:
      module: [https_gated]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/blackbox-gated.json"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-open
    metrics_path: /probe
    params:
      module: [https_open]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/blackbox-open.json"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # DNS health, A and AAAA split apart. The 2026-08-27 outage was AAAA
  # SERVFAILing at the router while A resolved fine; separating them
  # names the fault directly instead of surfacing it as an unrelated
  # service failure several layers downstream.
  - job_name: blackbox-dns
    metrics_path: /probe
    params:
      module: [dns_a]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/blackbox-dns.json"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Does Pi-hole still BLOCK, not merely answer. blackbox-dns passing
  # says a resolver replied; it says nothing about whether the query
  # reached Pi-hole or something upstream answered instead.
  - job_name: blackbox-dns-blocked
    metrics_path: /probe
    params:
      module: [dns_blocked]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/blackbox-dns-blocked.json"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-dns-aaaa
    metrics_path: /probe
    params:
      module: [dns_aaaa]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/blackbox-dns-aaaa.json"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Diun publishes diun_image_update_available{provider,image}, which is
  # what rules/alerts.yml turns into the "an update shipped" notification
  # that replaced Watchtower's silent 4am restarts.
  - job_name: diun
    static_configs:
      - targets: ["diun:9090"]

  # --- IDS/IPS -----------------------------------------------------------
  # Both live in docker-compose.ids.yml (standalone, not the swarm stack)
  # but attach to the edge overlay, so they resolve by container name.
  - job_name: suricata
    static_configs:
      - targets: ["suricata-exporter:9101"]

  - job_name: crowdsec
    static_configs:
      - targets: ["crowdsec:6060"]
