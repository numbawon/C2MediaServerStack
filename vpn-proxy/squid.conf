# A VPN exit for the apps that need one, with no password for them to store.
#
# Prowlarr, Sonarr, Radarr, Lidarr and LazyLibrarian search the internet
# through the VPN container's HTTP proxy, which demands a username and
# password. Every one of those apps stores that password in plain text, and
# several show it on a settings page that every Contributor can open. So the
# apps point HERE instead, with no credentials at all; this proxy is the only
# thing that holds the password, and it adds it on the way to the VPN.
#
# Who can use it: only containers on the `edge` overlay (the __EDGE_SUBNET__
# substitution below). It is not published on the LAN, so devices on the
# network cannot use it, unlike the VPN container's own authenticated port.
#
# The destination filter is the same one the private browsers' proxy uses
# (nuc-nodes/C2-Swarm-01/browser/squid.conf), for the same reason: the VPN
# container may reach the LAN and `edge`, and a proxy that forwards anywhere
# would let any app, or anything that compromised one, pivot through it. No
# `dst` ACLs, on purpose: they would make Squid resolve names itself,
# outside the tunnel.
http_port 3128

acl apps src __EDGE_SUBNET__

acl private_v4 dstdom_regex ^(0|10|127)\.[0-9.]+$
acl private_v4 dstdom_regex ^169\.254\.[0-9.]+$
acl private_v4 dstdom_regex ^192\.168\.[0-9.]+$
acl private_v4 dstdom_regex ^172\.(1[6-9]|2[0-9]|3[01])\.[0-9.]+$
acl private_v4 dstdom_regex ^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9.]+$
acl private_v4 dstdom_regex ^(22[4-9]|23[0-9]|24[0-9]|25[0-5])\.[0-9.]+$
acl private_v6 dstdom_regex -i ^\[?(::1?|f[cd][0-9a-f]{2}:[0-9a-f:]*|fe[89ab][0-9a-f]:[0-9a-f:]*)\]?$
acl internal_names dstdom_regex -i ^localhost$ \.local$ \.lan$ \.internal$ \.home$ \.localdomain$
acl internal_names dstdom_regex ^[^.]+$
acl bad_ports port 25 465 587

http_access deny !apps
http_access deny private_v4
http_access deny private_v6
http_access deny internal_names
http_access deny bad_ports
http_access allow apps
http_access deny all

# The VPN container's proxy, with the credentials (written at start from the
# existing secret files, never stored in this repo or on a settings page).
include /tmp/squid-peer.conf
never_direct allow all

cache deny all
access_log none
cache_log /dev/null
forwarded_for delete
via off
request_header_access X-Forwarded-For deny all
