server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  # A named volume, not /tmp -- /tmp is the container's own ephemeral
  # filesystem, wiped on every restart. Without this, any promtail restart
  # (a redeploy, a crash, the host rebooting) loses its read position and
  # re-scans whatever Docker log content is still on disk from the start,
  # re-encountering old lines Loki has already rejected once as too old and
  # retrying them forever (see the drop stage below for the other half of
  # this fix). global mode means each node gets its own copy of this
  # volume, tracking that node's own containers independently, which is
  # what should happen anyway.
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Discovers and tails containers via the Docker API on docker-socket-proxy
  # (never the raw socket) instead of bind-mounting host log files.
  - job_name: docker
    docker_sd_configs:
      - host: tcp://docker-socket-proxy:2375
        refresh_interval: 15s
    # Belt-and-suspenders for the positions-loss scenario above: even with
    # a persisted position, drop anything client-side that Loki would
    # reject anyway (limits_config in loki/loki-config.yaml has no explicit
    # reject_old_samples_max_age, so Loki's own default of 168h/7d applies).
    # Margin under that on purpose, not equal to it -- a line dropped here
    # is silently gone, a line rejected by Loki is at least visible in its
    # own log, so there is no reason to cut it as close as possible.
    pipeline_stages:
      - drop:
          older_than: 160h
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      # Strip Swarm's ".<replica>.<task-id>" suffix off the container
      # label. Without this every redeploy mints a brand new label value
      # -- 40 services had produced 143 distinct `container` values -- and
      # that is both the main way Loki gets slow and fat, and the reason a
      # saved `{container="..."}` query silently stops matching after any
      # deploy.
      #
      # The regex only matches names containing a dot, so standalone
      # containers (plex, pihole, sonarr, tdarr, suricata...) keep their
      # names untouched. They have no swarm_service label at all, so this
      # is the only way to query them and it must not be dropped.
      - source_labels: ["__meta_docker_container_name"]
        regex: "/([^.]+)\\..*"
        target_label: "container"
        replacement: "$1"
      - source_labels: ["__meta_docker_container_label_com_docker_swarm_service_name"]
        target_label: "swarm_service"

  # Router syslog, received over the network rather than read from a file.
  #
  # The router keeps its log in tmpfs (/opt/var/log/messages is a symlink
  # to /tmp/syslog.log), so every reboot wipes it -- precisely when the
  # contents matter most. After a slow reboot recovery, the network took
  # minutes to come back and the boot sequence explaining why had already
  # been flushed before anyone looked.
  #
  # RFC5424 over TCP because that is the only format promtail's syslog
  # receiver parses; the router's stock BSD-format remote logging
  # (nvram log_ipaddr) would NOT work here. syslog-ng's syslog() driver
  # emits RFC5424, which is why this goes through scribe rather than the
  # built-in setting. See router/syslog-ng-remote.conf.
  #
  # Caveat worth knowing: messages generated while the WAN is down can
  # only arrive once it returns. syslog-ng holds them in its in-memory
  # queue and flushes on reconnect, which covers a normal boot, but this
  # is not a substitute for the router keeping its own local history.
  - job_name: router-syslog
    syslog:
      listen_address: 0.0.0.0:1514
      listen_protocol: tcp
      idle_timeout: 120s
      use_incoming_timestamp: true
      labels:
        job: router
    relabel_configs:
      - source_labels: ["__syslog_message_hostname"]
        target_label: "host"
      - source_labels: ["__syslog_message_app_name"]
        target_label: "app"
      - source_labels: ["__syslog_message_severity"]
        target_label: "severity"
