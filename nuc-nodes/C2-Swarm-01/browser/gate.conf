# The front door. One hostname, one container per person behind it.
#
# Traefik hands every request for the browser hostname to this gate with NO
# auth of its own. The gate asks Authentik itself, per request, who the
# cookie belongs to, and takes the username from Authentik's ANSWER, never
# from a header the client sent. A request that merely claims to be someone
# (a forged X-authentik-username from another container on the same
# network) gets nothing: this server ignores the header and only trusts
# what the auth subrequest returns.
#
# users.map (generated from the Authentik `Browser` group) turns that
# username into the matching browser container. A user with no container
# maps to a name that does not exist, fails to resolve, and gets a plain
# message instead of anyone else's session.
#
# No access log: this is a privacy tool, and a log of who opened their
# browser when is not something to keep.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# $authentik_username is set below from the auth subrequest's response.
map $authentik_username $browser_upstream {
  include /etc/nginx/conf.d/users.map;
  # Not a real container: unmapped users fail to resolve and hit @nobrowser.
  default browser-unprovisioned;
}

server {
  listen 8080;
  server_name _;
  access_log off;
  # Redirects stay relative. By default nginx makes them absolute from its
  # OWN scheme and port, i.e. http://host:8080/..., which is the internal
  # address behind Traefik, not the https one the browser actually used.
  absolute_redirect off;
  client_max_body_size 2g;   # uploads into the remote browser

  # Authentik's outpost, reached the same way Traefik reaches it.
  location /outpost.goauthentik.io {
    proxy_pass          http://authentik-server:9000/outpost.goauthentik.io;
    proxy_set_header    Host $http_host;
    # Always https: TLS ends at Traefik, this hop is plain http.
    proxy_set_header    X-Original-URL https://$http_host$request_uri;
    add_header          Set-Cookie $auth_cookie;
    auth_request_set    $auth_cookie $upstream_http_set_cookie;
    proxy_pass_request_body off;
    proxy_set_header    Content-Length "";
  }

  location @authentik_signin {
    internal;
    add_header Set-Cookie $auth_cookie;
    return 302 /outpost.goauthentik.io/start?rd=$request_uri;
  }

  location @nobrowser {
    internal;
    default_type text/plain;
    return 403 "No private browser is available for your account (or it is still starting).\n";
  }

  location / {
    auth_request        /outpost.goauthentik.io/auth/nginx;
    error_page          401 = @authentik_signin;
    auth_request_set    $auth_cookie $upstream_http_set_cookie;
    add_header          Set-Cookie $auth_cookie;
    auth_request_set    $authentik_username $upstream_http_x_authentik_username;

    # No `if` here on purpose: nginx evaluates `if` before the auth
    # subrequest runs, so $authentik_username would still be empty.
    error_page          502 503 504 = @nobrowser;

    # KasmVNC's web client: a websocket for the screen, plain http for the
    # page. Long timeouts so an idle session is not cut; no buffering so the
    # picture is not held back.
    proxy_pass          http://$browser_upstream:3000;
    proxy_http_version  1.1;
    proxy_set_header    Host $http_host;
    proxy_set_header    Upgrade $http_upgrade;
    proxy_set_header    Connection $connection_upgrade;
    proxy_set_header    X-Real-IP "";
    proxy_set_header    X-Forwarded-For "";
    proxy_buffering     off;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
  }
}
