name: mediastack/app-noise
description: "Don't ban people Authentik has already authenticated"
#
# WHY THIS EXISTS
#
# CrowdSec banned the owner of the stack within hours of going live, while
# fully authenticated and doing nothing unusual. Modern web apps probe
# their own capabilities constantly -- Authentik websocket 403s, Grafana
# asking every user for a team list, Portainer CE checking for licence
# endpoints it does not have, browsers requesting PWA manifests that do
# not exist. To a generic scenario that is indistinguishable from
# reconnaissance.
#
# THE PRINCIPLE
#
# Auth is already handled, and handled earlier in the chain than CrowdSec.
# 25 of the 34 routers sit behind authentik@file, and forward-auth answers
# an unauthenticated request itself: Traefik returns a 302 and never
# proxies. So a request that REACHED A BACKEND on one of those routers was
# authenticated by definition, and banning its source IP punishes a known
# signed-in person for their browser's routine chatter.
#
# Traefik omits ServiceName when it answers a request without proxying, so
# its presence is the signal that auth succeeded. It cannot be read from
# a request header: the access log snapshots headers as received from the
# client, before forward-auth adds X-authentik-username, so that field is
# always empty and cannot be used here.
#
# What this deliberately does NOT cover:
#
#   - The nine routers with their own auth (Immich, Audiobookshelf,
#     Open WebUI, Cleanuparr do their own OIDC; Plex and ntfy have their
#     own accounts). Those stay fully watched, listed below.
#   - Unauthenticated traffic to protected routers. A scanner probing
#     grafana.<domain> gets a 302 and never reaches a backend, so it has
#     no ServiceName and is still counted. Probing is still detected.
#   - An authenticated user behaving badly. That is the accepted trade:
#     they are a known identity, so the answer is revoking their Authentik
#     account, not an IP ban that also catches everyone behind their NAT.
#
# KEEP THE LIST BELOW IN SYNC. If a router loses its authentik middleware
# it must be added here, or its traffic silently stops being watched.
whitelist:
  reason: "authenticated via Authentik, or the bouncer's own response"
  expression:
    # The feedback loop. Once an IP is banned the bouncer answers 403 to
    # everything it touches; those land in this same access log and renew
    # the ban that caused them, so it never expires. Enforcement must
    # never feed detection. Keep this first.
    - 'evt.Meta.http_status == "403" && not (evt.Line.Raw contains "ServiceName")'

    # Reached a backend behind forward-auth => Authentik let them through.
    - >-
      evt.Line.Raw contains "ServiceName" &&
      not (evt.Meta.traefik_router_name matches
      "^(audiobookshelf|authentik|cleanuparr|immich|navidrome-api|ntfy|open-webui|overseerr-to-seerr|plex)@")

    # Browsers ask every site for these regardless of auth, including on
    # the routers above that are still watched.
    - 'evt.Meta.http_path endsWith "/manifest.json"'
    - 'evt.Meta.http_path endsWith "/favicon.ico"'
