# Local AppSec config. A copy of crowdsecurity/appsec-default with one
# rule set removed, kept here rather than edited in place so a collection
# update cannot silently restore it.
name: mediastack/appsec
default_remediation: ban

inband_rules:
  - crowdsecurity/base-config
  - crowdsecurity/vpatch-*
  - crowdsecurity/generic-*

outofband_rules:
  # crowdsecurity/experimental-* is deliberately NOT included.
  #
  # The only experimental rule installed is experimental-no-user-agent,
  # and it fired 11 times on normal traffic within minutes of AppSec going
  # live. A missing User-Agent is routine for health checks, API clients
  # and command-line tools -- it is not evidence of an attack, and leaving
  # it on would train us to ignore the report, which is the failure mode
  # this whole exercise exists to avoid.
  #
  # It was out-of-band, so it never blocked anything; it was noise, not
  # risk. If other experimental rules are added upstream later, list the
  # wanted ones explicitly here rather than restoring the wildcard.
  - crowdsecurity/appsec-generic-test
