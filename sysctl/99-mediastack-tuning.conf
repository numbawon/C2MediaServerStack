# Kernel tuning for this host. Install to /etc/sysctl.d/ and apply with:
#   sudo cp sysctl/99-mediastack-tuning.conf /etc/sysctl.d/
#   sudo sysctl --system

# The default of 60 is tuned for machines where RAM is scarce: it evicts
# idle anonymous pages eagerly to keep the page cache large. This host has
# 62 GB with ~46 GB available and only ~16 GB committed, so that trade is
# backwards here -- it had pushed 3.3 GB of a 4 GB swap file out, including
# gnome-shell on a headless box, purely because nothing had touched those
# pages recently.
#
# Nothing was misbehaving as a result; this is about latency, not capacity.
# A service whose pages were evicted while idle stalls on the way back in,
# and the swap file was down to 765 MB of headroom for no benefit.
#
# 10 rather than 0: still swaps under genuine memory pressure, which is
# the behaviour you want as a safety valve, but stops treating idle
# processes as the first thing to evict.
vm.swappiness = 10
