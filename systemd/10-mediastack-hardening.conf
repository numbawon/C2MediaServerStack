# sshd drop-in. Install to /etc/ssh/sshd_config.d/
#
# Key-only auth -- authorized_keys already has 3 keys on it, so password
# auth is pure attack surface with no upside, especially once this host
# gets an internet-reachable path via the emergency SSH tunnel (see
# cloudflared-emergency.service). Does NOT change ListenAddress -- sshd
# stays reachable on the LAN exactly as before, this only removes the
# password/root fallback.
PasswordAuthentication no
PubkeyAuthentication yes
PermitRootLogin no

# Trust short-lived SSH certs issued by Cloudflare Access for the
# ssh.example.com emergency tunnel -- these expire in ~3 minutes, so a
# stolen one is worthless almost immediately. This is IN ADDITION TO
# authorized_keys above, not instead of it: either a valid long-lived key
# or a fresh Access-issued cert gets you in.
TrustedUserCAKeys /etc/ssh/ca.pub
