# Drop-in for docker.service itself (NOT a standalone unit -- this file
# only means something inside /etc/systemd/system/docker.service.d/).
#
# mediastack-recovery.service (see that file) only runs on an actual host
# boot (WantedBy=multi-user.target). A plain `sudo systemctl restart
# docker` -- needed for /etc/docker/daemon.json changes, like the
# registry's insecure-registries entry -- stops every standalone compose
# container the same way a reboot does, but does NOT trigger the recovery
# service at all, since that only fires on boot. Confirmed the hard way:
# after one such restart, suricata (docker-compose.ids.yml,
# restart: unless-stopped) never came back, silently, while other
# containers in the same file did.
#
# This closes that gap by hooking docker.service's own startup directly,
# so recovery fires on either trigger, not just a boot.
#
# --no-block: fires the recovery script as an independent, disconnected
# transient unit rather than something docker.service waits on. Recovery
# can take a while (image pulls, several compose stacks); ExecStartPost
# normally blocks a unit from being considered fully started until it
# finishes, and Swarm plus everything else here waits on docker.service
# being active, so a blocking hook would add that delay to every restart.
#
# Replace youruser (below) with your actual repo path before installing.
#
# Install (does not need a docker restart to take effect -- only affects
# the *next* time docker.service starts, whichever way):
#   sudo mkdir -p /etc/systemd/system/docker.service.d
#   sudo cp systemd/docker-service-mediastack-recovery.conf \
#     /etc/systemd/system/docker.service.d/mediastack-recovery.conf
#   sudo systemctl daemon-reload

[Service]
ExecStartPost=/usr/bin/systemd-run --no-block --unit=mediastack-recovery-post-restart --description="mediastack recovery after docker.service (re)start" /home/youruser/C2MediaServerStack/scripts/deploy.sh recovery
